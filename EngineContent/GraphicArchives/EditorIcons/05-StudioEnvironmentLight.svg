<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name="studio-light">
<defs>
<linearGradient id="lightPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#241e17"/><stop offset="100%" stop-color="#0d0a08"/></linearGradient>
<linearGradient id="lightRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#806346" stop-opacity="0.8"/><stop offset="100%" stop-color="#2e1f14" stop-opacity="0.3"/></linearGradient>
<linearGradient id="brassBase" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8c6834"/><stop offset="50%" stop-color="#ffe082"/><stop offset="100%" stop-color="#6d4c1b"/></linearGradient>
<radialGradient id="bulbGlow" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#ffffff"/><stop offset="25%" stop-color="#fff59d"/><stop offset="55%" stop-color="#ffb300"/><stop offset="85%" stop-color="#ff6f00"/><stop offset="100%" stop-color="#3e1a00" stop-opacity="0.2"/></radialGradient>
<linearGradient id="rayCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe082" stop-opacity="0.6"/><stop offset="100%" stop-color="#ff8f00" stop-opacity="0"/></linearGradient>
<filter id="filamentGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
</defs>
<rect x="6" y="6" width="108" height="108" rx="26" fill="url(#lightPlate)"/>
<rect x="6.75" y="6.75" width="106.5" height="106.5" rx="25.25" fill="none" stroke="url(#lightRim)" stroke-width="1.5"/>
<!-- Fanning Directional Light Rays -->
<polygon points="60,42 12,102 108,102" fill="url(#rayCone)"/>
<line x1="60" y1="42" x2="20" y2="100" stroke="#ffe082" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>
<line x1="60" y1="42" x2="100" y2="100" stroke="#ffe082" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>
<line x1="60" y1="42" x2="60" y2="102" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
<!-- Threaded Brass Base Cap -->
<rect x="48" y="16" width="24" height="14" rx="2" fill="url(#brassBase)"/>
<line x1="48" y1="20" x2="72" y2="20" stroke="#422f0f" stroke-width="1"/>
<line x1="48" y1="24" x2="72" y2="24" stroke="#422f0f" stroke-width="1"/>
<line x1="48" y1="28" x2="72" y2="28" stroke="#422f0f" stroke-width="1"/>
<rect x="52" y="12" width="16" height="5" rx="1" fill="#2d2213"/>
<!-- Glass Bulb Envelope -->
<path d="M48 30 C34 30 26 44 26 58 C26 74 44 82 52 82 L68 82 C76 82 94 74 94 58 C94 44 86 30 72 30 Z" fill="url(#bulbGlow)"/>
<path d="M48 30 C34 30 26 44 26 58 C26 74 44 82 52 82 L68 82 C76 82 94 74 94 58 C94 44 86 30 72 30 Z" fill="none" stroke="#ffe082" stroke-width="1.2" opacity="0.7"/>
<!-- Tungsten Filament & Mount -->
<path d="M52 68 L54 50 L60 44 L66 50 L68 68" fill="none" stroke="#ffe082" stroke-width="1.2"/>
<path d="M54 50 C57 44 63 44 66 50" fill="none" stroke="#ffffff" stroke-width="2" filter="url(#filamentGlow)"/>
<!-- Bulb Glass Reflection Highlights -->
<path d="M34 44 A24 24 0 0 1 52 33" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
<circle cx="78" cy="62" r="3" fill="#ffffff" opacity="0.3"/>
</svg>