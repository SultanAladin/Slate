<!-- X Axis (Right - Red) -->
<line x1="60" y1="60" x2="96" y2="60" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
<polygon points="104,60 92,53 92,67" fill="#ef4444"/>
<!-- Y Axis (Down-Left - Green) -->
<line x1="60" y1="60" x2="32" y2="88" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
<polygon points="26,94 38,88 32,76" fill="#10b981"/>
<!-- Origin Center Ring -->
<circle cx="60" cy="60" r="8" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
<circle cx="60" cy="60" r="3" fill="#f8fafc"/>
</svg>