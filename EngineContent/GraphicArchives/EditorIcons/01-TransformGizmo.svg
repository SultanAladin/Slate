<path d="M30 90 A 42 42 0 0 1 90 30" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6 6"/>
<!-- Z Axis (Up - Blue) -->
<line x1="60" y1="60" x2="60" y2="24" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
