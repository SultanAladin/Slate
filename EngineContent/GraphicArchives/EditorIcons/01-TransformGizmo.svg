<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name="transform-gizmo">
<defs>
<linearGradient id="gizPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#181c26"/><stop offset="50%" stop-color="#0e1118"/><stop offset="100%" stop-color="#07080c"/></linearGradient>
<linearGradient id="gizRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4f5866" stop-opacity="0.8"/><stop offset="100%" stop-color="#191d26" stop-opacity="0.3"/></linearGradient>
<linearGradient id="gizZ" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#2a303c"/><stop offset="50%" stop-color="#8a96a6"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>
<linearGradient id="gizX" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0%" stop-color="#1d222e"/><stop offset="60%" stop-color="#606c7d"/><stop offset="100%" stop-color="#d0d7e5"/></linearGradient>
<linearGradient id="gizY" x1="1" y1="0" x2="0" y2="0.6"><stop offset="0%" stop-color="#151922"/><stop offset="60%" stop-color="#414a5a"/><stop offset="100%" stop-color="#9da8b6"/></linearGradient>
<radialGradient id="gizOrb" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#c8d1dc"/><stop offset="70%" stop-color="#4f5866"/><stop offset="100%" stop-color="#121620"/></radialGradient>
<filter id="gizGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
</defs>
<rect x="6" y="6" width="108" height="108" rx="26" fill="url(#gizPlate)"/>
<rect x="6.75" y="6.75" width="106.5" height="106.5" rx="25.25" fill="none" stroke="url(#gizRim)" stroke-width="1.5"/>
<ellipse cx="60" cy="92" rx="34" ry="8" fill="#000000" opacity="0.45" filter="blur(3px)"/>
<!-- Outer Rotation Arcs -->
<circle cx="60" cy="62" r="38" fill="none" stroke="#2a313d" stroke-width="1.2" stroke-dasharray="2 4"/>
<circle cx="60" cy="62" r="32" fill="none" stroke="#485363" stroke-width="1" stroke-dasharray="18 6 4 6" opacity="0.6"/>
<!-- Z Axis (Up) -->
<path d="M60 62 L60 22" stroke="url(#gizZ)" stroke-width="3" stroke-linecap="round"/>
<polygon points="60,15 54,26 66,26" fill="url(#gizZ)"/>
<polygon points="60,15 54,26 60,24" fill="#ffffff" opacity="0.7"/>
<!-- X Axis (Right-Down) -->
<path d="M60 62 L92 80" stroke="url(#gizX)" stroke-width="3" stroke-linecap="round"/>
<polygon points="98,83 86,75 89,87" fill="url(#gizX)"/>
<polygon points="98,83 86,75 92,81" fill="#ffffff" opacity="0.6"/>
<!-- Y Axis (Left-Down) -->
<path d="M60 62 L28 80" stroke="url(#gizY)" stroke-width="3" stroke-linecap="round"/>
<polygon points="22,83 31,87 34,75" fill="url(#gizY)"/>
<polygon points="22,83 28,81 34,75" fill="#ffffff" opacity="0.4"/>
<!-- Center Chrome Orb & Handle Ring -->
<circle cx="60" cy="62" r="11" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
<circle cx="60" cy="62" r="8" fill="url(#gizOrb)" filter="url(#gizGlow)"/>
<ellipse cx="57.5" cy="59.5" rx="2.5" ry="1.5" transform="rotate(-30 57.5 59.5)" fill="#ffffff" opacity="0.85"/>
<!-- Handle Nodes on Arcs -->
<circle cx="60" cy="24" r="2.5" fill="#ffffff"/>
<circle cx="92" cy="62" r="2.5" fill="#aab4c2"/>
<circle cx="28" cy="62" r="2.5" fill="#687385"/>
</svg>