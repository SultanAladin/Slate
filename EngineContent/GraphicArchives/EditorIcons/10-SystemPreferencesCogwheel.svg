<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name="editor-settings">
<defs>
<linearGradient id="setPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#161a22"/><stop offset="100%" stop-color="#090b0e"/></linearGradient>
<linearGradient id="setRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4e5869" stop-opacity="0.8"/><stop offset="100%" stop-color="#181d26" stop-opacity="0.3"/></linearGradient>
<linearGradient id="chromeGear" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="25%" stop-color="#cbd5e1"/><stop offset="60%" stop-color="#475569"/><stop offset="90%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
