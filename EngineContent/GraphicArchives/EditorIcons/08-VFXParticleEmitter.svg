<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name="vfx-particles">
<defs>
<linearGradient id="ptb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3440"/><stop offset="1" stop-color="#101216"/></linearGradient>
<linearGradient id="ptg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".30"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="pte" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".62"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity=".20"/></linearGradient>
<clipPath id="ptc"><rect x="6" y="6" width="108" height="108" rx="27"/></clipPath>
<filter id="ptd" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect x="6" y="6" width="108" height="108" rx="27" fill="url(#ptb)"/>
<g clip-path="url(#ptc)"><path d="M6 6H114V44C92 60 28 60 6 44Z" fill="url(#ptg)"/></g>
<radialGradient id="ptS" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#ff80ab"/><stop offset=".55" stop-color="#ff1744"/><stop offset=".85" stop-color="#651fff"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="ptR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#ff1744"/><stop offset="1" stop-color="#7c4dff"/></linearGradient>
<!-- Orbiting Ring Ellipses -->
<ellipse cx="60" cy="62" rx="38" ry="14" fill="none" stroke="url(#ptR)" stroke-width="1.8" transform="rotate(-20 60 62)" opacity=".8"/>
<ellipse cx="60" cy="62" rx="34" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.2" transform="rotate(35 60 62)"/>
<!-- Plasma Core -->
<g filter="url(#ptd)">
<circle cx="60" cy="62" r="26" fill="url(#ptS)"/>
<circle cx="60" cy="62" r="9" fill="#ffffff"/>
</g>
<!-- Floating Spark Particles & Trails -->
<line x1="60" y1="62" x2="38" y2="26" stroke="#ff80ab" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/>
<circle cx="38" cy="26" r="3.5" fill="#ffffff"/>
<line x1="60" y1="62" x2="82" y2="22" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="2 4" opacity=".8"/>
<circle cx="82" cy="22" r="4" fill="#00e5ff"/>
<line x1="60" y1="62" x2="26" y2="76" stroke="#ff1744" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/>
<circle cx="26" cy="76" r="2.5" fill="#ff1744"/>
<line x1="60" y1="62" x2="92" y2="74" stroke="#7c4dff" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
<circle cx="92" cy="74" r="3" fill="#b388ff"/>
<circle cx="48" cy="18" r="1.8" fill="#ffffff"/>
<circle cx="70" cy="14" r="2" fill="#ff80ab"/>
<circle cx="58" cy="16" r="2.5" fill="#ffffff"/>
<rect x="6.75" y="6.75" width="106.5" height="106.5" rx="26.3" fill="none" stroke="url(#pte)" stroke-width="1.5"/>
</svg>