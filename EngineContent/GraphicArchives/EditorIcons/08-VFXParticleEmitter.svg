<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name="vfx-particles">
<defs>
<linearGradient id="vfxPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#241220"/><stop offset="100%" stop-color="#0a040e"/></linearGradient>
<linearGradient id="vfxRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7e3870" stop-opacity="0.8"/><stop offset="100%" stop-color="#2a0c25" stop-opacity="0.3"/></linearGradient>
<radialGradient id="plasmaCore" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="20%" stop-color="#ff80ab"/><stop offset="50%" stop-color="#ff1744"/><stop offset="80%" stop-color="#651fff"/><stop offset="100%" stop-color="#000000" stop-opacity="0"/></radialGradient>
<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00e5ff"/><stop offset="50%" stop-color="#ff1744"/><stop offset="100%" stop-color="#7c4dff"/></linearGradient>
<filter id="vfxGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
</defs>
<rect x="6" y="6" width="108" height="108" rx="26" fill="url(#vfxPlate)"/>
<rect x="6.75" y="6.75" width="106.5" height="106.5" rx="25.25" fill="none" stroke="url(#vfxRim)" stroke-width="1.5"/>
<!-- Orbiting Energy Field Ring 1 -->
<ellipse cx="60" cy="66" rx="38" ry="14" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" transform="rotate(-20 60 66)" opacity="0.8"/>
<!-- Orbiting Energy Field Ring 2 -->
<ellipse cx="60" cy="66" rx="34" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.2" transform="rotate(35 60 66)" filter="url(#vfxGlow)"/>
<!-- Central Plasma Core -->
<circle cx="60" cy="66" r="28" fill="url(#plasmaCore)"/>
<circle cx="60" cy="66" r="10" fill="#ffffff" filter="url(#vfxGlow)"/>
<!-- Floating Spark Particles with Trails -->
<line x1="60" y1="66" x2="38" y2="30" stroke="#ff80ab" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
<circle cx="38" cy="30" r="3.5" fill="#ffffff" filter="url(#vfxGlow)"/>
<line x1="60" y1="66" x2="82" y2="26" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
<circle cx="82" cy="26" r="4" fill="#00e5ff" filter="url(#vfxGlow)"/>
<line x1="60" y1="66" x2="26" y2="78" stroke="#ff1744" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
<circle cx="26" cy="78" r="2.5" fill="#ff1744"/>
<line x1="60" y1="66" x2="92" y2="76" stroke="#7c4dff" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
<circle cx="92" cy="76" r="3" fill="#b388ff"/>
<!-- Additional Micro Sparks -->
<circle cx="48" cy="22" r="1.8" fill="#ffffff"/>
<circle cx="70" cy="18" r="2" fill="#ff80ab"/>
<circle cx="28" cy="48" r="1.5" fill="#00e5ff"/>
<circle cx="94" cy="46" r="2.2" fill="#ff1744"/>
<circle cx="58" cy="20" r="2.5" fill="#ffffff" filter="url(#vfxGlow)"/>
</svg>