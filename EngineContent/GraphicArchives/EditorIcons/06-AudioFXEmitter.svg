<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name="audio-emitter">
<defs>
<linearGradient id="audPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#181512"/><stop offset="100%" stop-color="#080705"/></linearGradient>
<linearGradient id="audRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#664d26" stop-opacity="0.8"/><stop offset="100%" stop-color="#261b0a" stop-opacity="0.3"/></linearGradient>
<linearGradient id="amberGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe082"/><stop offset="50%" stop-color="#ffb300"/><stop offset="100%" stop-color="#ff6f00"/></linearGradient>
<linearGradient id="amberWave" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffb300"/><stop offset="100%" stop-color="#ffe082" stop-opacity="0.1"/></linearGradient>
<filter id="amberGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
</defs>
<rect x="6" y="6" width="108" height="108" rx="26" fill="url(#audPlate)"/>
<rect x="6.75" y="6.75" width="106.5" height="106.5" rx="25.25" fill="none" stroke="url(#audRim)" stroke-width="1.5"/>
<!-- Loudspeaker Housing Rim -->
<path d="M18 36 L36 48 L36 76 L18 88 Z" fill="#1f1b18" stroke="#3d332d" stroke-width="1.5"/>
<path d="M36 48 L62 30 L62 94 L36 76 Z" fill="url(#amberGold)"/>
<!-- Speaker Cone Diaphragm Rings -->
<ellipse cx="62" cy="62" rx="6" ry="32" fill="#14100c" stroke="#3d3024" stroke-width="1.5"/>
<ellipse cx="62" cy="62" rx="3" ry="18" fill="url(#amberGold)"/>
<!-- Center Dust Cap -->
<ellipse cx="62" cy="62" rx="2" ry="8" fill="#ffffff" filter="url(#amberGlow)"/>
<!-- Concentric Acoustic Soundwaves -->
<path d="M74 44 A 24 24 0 0 1 74 80" fill="none" stroke="url(#amberGold)" stroke-width="3" stroke-linecap="round" filter="url(#amberGlow)"/>
<path d="M84 36 A 36 36 0 0 1 84 88" fill="none" stroke="url(#amberGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
<path d="M94 28 A 48 48 0 0 1 94 96" fill="none" stroke="url(#amberGold)" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
<!-- Equalizer Spectrum Bars (Bottom Corner) -->
<rect x="20" y="24" width="3" height="8" rx="1.5" fill="#ffb300"/>
<rect x="26" y="20" width="3" height="12" rx="1.5" fill="#ffe082"/>
<rect x="32" y="22" width="3" height="10" rx="1.5" fill="#ffb300"/>
<rect x="38" y="26" width="3" height="6" rx="1.5" fill="#ff8f00"/>
</svg>