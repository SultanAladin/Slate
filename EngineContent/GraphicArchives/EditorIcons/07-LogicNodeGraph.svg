<linearGradient id="ndWire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#d500f9"/></linearGradient>
<!-- Left Card -->
<g filter="url(#ndd)">
<rect x="18" y="26" width="44" height="68" rx="6" fill="#1c162e" stroke="#3e2d5c" stroke-width="1.2"/>
