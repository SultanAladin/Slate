<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name="logic-node">
<defs>
<linearGradient id="ndb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#251a33"/><stop offset="1" stop-color="#0d0716"/></linearGradient>
<linearGradient id="ndg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".30"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="nde" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".62"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity=".20"/></linearGradient>
<clipPath id="ndc"><rect x="6" y="6" width="108" height="108" rx="27"/></clipPath>
<filter id="ndd" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect x="6" y="6" width="108" height="108" rx="27" fill="url(#ndb)"/>
