<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name="scene-camera">
<defs>
<linearGradient id="camPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a1e27"/><stop offset="100%" stop-color="#0a0c10"/></linearGradient>
<linearGradient id="camRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5a6375" stop-opacity="0.8"/><stop offset="100%" stop-color="#1e222d" stop-opacity="0.3"/></linearGradient>
<linearGradient id="camBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3d4452"/><stop offset="40%" stop-color="#252a34"/><stop offset="100%" stop-color="#12151c"/></linearGradient>
<linearGradient id="camBrass" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#996515"/><stop offset="50%" stop-color="#f7d070"/><stop offset="100%" stop-color="#80500d"/></linearGradient>
<linearGradient id="camBlueRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00b0ff"/><stop offset="100%" stop-color="#004182"/></linearGradient>
<radialGradient id="camGlass" cx="38%" cy="32%" r="85%"><stop offset="0%" stop-color="#a7ffeb"/><stop offset="22%" stop-color="#00e676"/><stop offset="50%" stop-color="#005b4f"/><stop offset="80%" stop-color="#00251a"/><stop offset="100%" stop-color="#020d09"/></radialGradient>
<radialGradient id="camTally" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#ff8a80"/><stop offset="40%" stop-color="#ff1744"/><stop offset="100%" stop-color="#800000"/></radialGradient>
<filter id="tallyGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
</defs>
<rect x="6" y="6" width="108" height="108" rx="26" fill="url(#camPlate)"/>
<rect x="6.75" y="6.75" width="106.5" height="106.5" rx="25.25" fill="none" stroke="url(#camRim)" stroke-width="1.5"/>
<ellipse cx="60" cy="96" rx="36" ry="7" fill="#000000" opacity="0.5" filter="blur(3px)"/>
<!-- Camera Body -->
<rect x="18" y="32" width="84" height="58" rx="10" fill="url(#camBody)"/>
<rect x="18" y="32" width="84" height="10" rx="10" fill="#525b6c" opacity="0.4"/>
<line x1="18" y1="42" x2="102" y2="42" stroke="#0d0f14" stroke-width="1.5"/>
<!-- Screws & Accents -->
<circle cx="26" cy="37" r="2" fill="#12151c"/><circle cx="26" cy="37" r="1" fill="#788496"/>
<circle cx="94" cy="37" r="2" fill="#12151c"/><circle cx="94" cy="37" r="1" fill="#788496"/>
<!-- Tally Light -->
<circle cx="82" cy="37" r="3.5" fill="url(#camTally)" filter="url(#tallyGlow)"/>
<!-- Lens Outer Ring -->
<circle cx="56" cy="62" r="28" fill="#181c24" stroke="#0a0c10" stroke-width="2"/>
<circle cx="56" cy="62" r="26" fill="none" stroke="url(#camBrass)" stroke-width="1.5"/>
<circle cx="56" cy="62" r="24" fill="none" stroke="url(#camBlueRing)" stroke-width="2"/>
<circle cx="56" cy="62" r="21" fill="#080a0e"/>
<!-- Lens Glass Element -->
<circle cx="56" cy="62" r="19" fill="url(#camGlass)"/>
<!-- Aperture Blades -->
<polygon points="56,45 66,54 59,62" fill="#05120e" opacity="0.8"/>
<polygon points="67,56 64,68 56,62" fill="#05120e" opacity="0.8"/>
<polygon points="61,71 49,68 56,62" fill="#05120e" opacity="0.8"/>
<polygon points="46,68 48,55 56,62" fill="#05120e" opacity="0.8"/>
<polygon points="46,53 58,48 56,62" fill="#05120e" opacity="0.8"/>
<!-- Optical Core Pupil -->
<circle cx="56" cy="62" r="8" fill="#020806"/>
<circle cx="56" cy="62" r="8" fill="none" stroke="#00e676" stroke-width="0.8" opacity="0.6"/>
<!-- Lens Reflection Flares -->
<ellipse cx="48" cy="52" rx="9" ry="4.5" transform="rotate(-38 48 52)" fill="#ffffff" opacity="0.32"/>
<ellipse cx="65" cy="71" rx="5" ry="2.2" transform="rotate(-38 65 71)" fill="#80ffe1" opacity="0.25"/>
<!-- Side Viewfinder / Mic -->
<rect x="88" y="52" width="16" height="20" rx="3" fill="#1a1e27" stroke="#333a46" stroke-width="1"/>
<circle cx="96" cy="62" r="4" fill="#0b0d12"/>
<circle cx="96" cy="62" r="2" fill="#00e5ff" opacity="0.8"/>
</svg>