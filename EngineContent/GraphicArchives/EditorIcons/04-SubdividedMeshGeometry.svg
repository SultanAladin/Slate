<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" data-name="geometry-mesh">
<rect width="120" height="120" rx="24" fill="#0f172a"/>
<!-- Top Face -->
<polygon points="60,24 92,40 60,56 28,40" fill="#0f766e"/>
<!-- Left Face -->
<polygon points="28,40 60,56 60,92 28,76" fill="#115e59"/>
<!-- Right Face -->
<polygon points="60,56 92,40 92,76 60,92" fill="#134e4a"/>
<!-- Subdivision Wireframe Lines -->
<g stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<polygon points="60,24 92,40 60,56 28,40" fill="none"/>
<polygon points="28,40 60,56 60,92 28,76" fill="none"/>
<polygon points="60,56 92,40 92,76 60,92" fill="none"/>
<line x1="44" y1="32" x2="76" y2="48"/>
<line x1="76" y1="32" x2="44" y2="48"/>
<line x1="44" y1="48" x2="44" y2="84"/>
<line x1="76" y1="48" x2="76" y2="84"/>
</g>
<!-- Vertex Dots -->
<circle cx="60" cy="24" r="3.5" fill="#2dd4bf"/>
<circle cx="92" cy="40" r="3.5" fill="#2dd4bf"/>
<circle cx="28" cy="40" r="3.5" fill="#2dd4bf"/>
<circle cx="60" cy="56" r="4" fill="#ffffff"/>
<circle cx="28" cy="76" r="3.5" fill="#2dd4bf"/>
<circle cx="92" cy="76" r="3.5" fill="#2dd4bf"/>
<circle cx="60" cy="92" r="3.5" fill="#2dd4bf"/>
</svg>