<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#10141b"/><style>text{font:17px sans-serif;fill:#e8edf5}.g{stroke:#435269;stroke-width:1;opacity:.8}.m{stroke:#7589a3;stroke-width:2}.x{stroke:#f23d52;stroke-width:4}.z{stroke:#4c83ff;stroke-width:4}.r{fill:none;stroke:#ffd166;stroke-width:5}</style><text x="24" y="32" font-size="24">Deterministic perspective-floor proof</text><text x="24" y="58">Perspective rays intersect one fixed world plane: Y = 0. Drawing is restricted to this floor.</text><path class="g" d="M40 500L450 300L860 500M100 520L450 300L800 520M180 540L450 300L720 540M260 555L450 300L640 555M340 560L450 300L560 560M450 300V560M450 300L40 500M450 300L860 500M450 300L100 520M450 300L800 520"/><path class="m" d="M40 500L450 300L860 500M100 520L450 300L800 520M450 300V560"/><path class="x" d="M450 300L860 500"/><path class="z" d="M450 300L40 500"/><path class="r" d="M350 360L450 335L555 365L450 390Z"/><circle cx="450" cy="300" r="6" fill="#fff"/><text x="700" y="520" fill="#f23d52">X axis</text><text x="54" y="520" fill="#4c83ff">Z axis</text><text x="466" y="288">floor intersection</text><text x="300" y="535">grid remains visible independent of camera distance</text></svg>