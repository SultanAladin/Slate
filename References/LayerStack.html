<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate — Layer Stack</title>
<style>
  /* ══════════════════════════════════════════════════════════════════
     LAYER STACK — stack pane styled after LayerstackV1.html
     (colour tag stripes · square checker thumbs + type badge · mono
     sub-lines · dashed attached mask rows · search + filter tools row
     · folders). Shell stays OutlinerV2: [ stack | details ] → slide →
     [ properties ] with header-only nav. Channels = CPP accordion.
     ══════════════════════════════════════════════════════════════════ */
  :root{
    --bg:#050505; --panel:#121212; --inset:#1a1a1a; --field:#000;
    --raised:#222; --selected:#202020;
    --row:#0d0d0d; --row-h:#161616;
    --stroke:rgba(255,255,255,.075); --stroke-2:rgba(255,255,255,.18);
    --text:#f0f0f0; --text-dim:#888; --text-faint:#5c5c5c;
    --accent:#fff; --hi:#6c77ff; --danger:#ef4444;
    --ax-x:#ef5350; --ax-y:#69d06d; --ax-z:#5b8cff;
    --hue-gen:#10b981;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --r-panel:24px; --r-inset:18px; --r-pill:999px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; user-select:none;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:28px; overflow:hidden;}

  .card{
    width:min(1000px,96vw); height:min(680px,92vh);
    background:var(--panel); border-radius:var(--r-panel);
    box-shadow:0 24px 70px rgba(0,0,0,.65);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .card-head,.card-foot{flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:0 20px;}
  .card-head{height:56px; border-bottom:1px solid rgba(255,255,255,.06);}
  .card-foot{height:42px; border-top:1px solid rgba(255,255,255,.06); color:var(--text-faint); font-size:11.5px;}
  .h-title{font-size:14px;font-weight:600;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .h-sub{font-size:11px;color:var(--text-faint);}
  .spacer{flex:1;}
  .iconbtn{
    width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;
    background:var(--raised);color:var(--text-dim);display:grid;place-items:center;
    transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);
  }
  .iconbtn:hover{background:#2e2e2e;color:var(--text);transform:scale(1.08);}
  .iconbtn:active{transform:scale(.94);}
  .iconbtn.props{background:var(--accent);color:#000;}
  .iconbtn.props:hover{background:#e6e6e6;}
  .iconbtn:disabled{opacity:.35;pointer-events:none;}

  .view-wrap{flex:1;overflow:hidden;min-height:0;}
  .view-track{display:flex;width:200%;height:100%;transition:transform .34s var(--ease);}
  .view{flex:0 0 50%;height:100%;display:flex;min-width:0;}

  .tree-pane{flex:0 0 48%;min-width:0;display:flex;flex-direction:column;
    border-right:1px solid rgba(255,255,255,.06);}
  .det-pane{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;
    padding:14px 18px 16px;}
  .det-pane::-webkit-scrollbar{display:none;}

  /* ── tools row (LayerstackV1 pattern) ───────────────────────────── */
  .tools{display:flex;align-items:center;gap:6px;padding:12px 14px 8px;}
  .search{flex:1;display:flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:var(--r-pill);
    background:var(--field);border:1px solid var(--stroke);transition:border-color .14s;}
  .search:focus-within{border-color:var(--stroke-2);}
  .search svg{flex:0 0 13px;}
  .search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font-size:12px;user-select:text;}
  .search input::placeholder{color:var(--text-faint);}
  .tico{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;border-radius:9px;
    border:1px solid transparent;background:transparent;color:var(--text-dim);cursor:pointer;
    transition:background .13s var(--ease),color .13s var(--ease),border-color .13s var(--ease),transform .12s var(--ease);}
  .tico:hover{background:rgba(255,255,255,.08);color:var(--text);border-color:var(--stroke);}
  .tico:active{transform:scale(.93);}
  .filter-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:0 14px 8px;}
  .filter-row:empty{display:none;}
  .pill{
    height:26px;padding:0 5px 0 11px;border-radius:var(--r-pill);
    background:#fff;color:#000;font-size:11px;font-weight:600;
    display:flex;align-items:center;gap:6px;animation:pillIn .22s var(--ease);
  }
  @keyframes pillIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  .pill .px{width:17px;height:17px;border-radius:50%;border:none;cursor:pointer;background:transparent;color:#000;
    font-size:10px;display:grid;place-items:center;transition:background .15s var(--ease),color .15s var(--ease);}
  .pill .px:hover{background:var(--danger);color:#fff;}
  .divider{height:1px;background:rgba(255,255,255,.07);margin:0 14px 6px;}

  /* ── stack (V1 row language) ────────────────────────────────────── */
  .tree{flex:1;overflow-y:auto;padding:2px 10px 12px;scrollbar-width:none;position:relative;}
  .tree::-webkit-scrollbar{display:none;}
  .row{
    position:relative;display:flex;align-items:center;gap:8px;
    min-height:44px;padding:5px 6px 5px 12px;margin:2px 0;
    background:var(--row);border:1px solid transparent;
    cursor:default;transition:background .11s var(--ease);
  }
  .row:hover{background:var(--row-h);}
  .row.sel{background:var(--selected);border-color:var(--stroke-2);}
  .row.dragging{opacity:.35;}
  .row.drop-into{border-color:#fff;}
  .row.off .thumb,.row.off .meta{opacity:.34;filter:saturate(.15);}
  .ctag{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#555);pointer-events:none;}
  .row.msk .ctag{background:repeating-linear-gradient(180deg,var(--c,#888) 0 3px,transparent 3px 7px);opacity:.85;}
  .dropline{position:absolute;left:10px;right:10px;height:2px;background:var(--accent);border-radius:1px;
    display:none;pointer-events:none;z-index:5;}

  .tw{width:14px;flex:0 0 14px;display:grid;place-items:center;background:none;border:0;
    color:var(--text-faint);cursor:pointer;}
  .tw svg{transition:transform .22s var(--ease);}
  .tw.closed svg{transform:rotate(-90deg);}
  .tw.void{pointer-events:none;opacity:0;}

  /* square checker thumb + type badge */
  .thumb{position:relative;width:34px;height:34px;flex:0 0 34px;box-shadow:0 0 0 1px rgba(255,255,255,.15);}
  .thumb .tv{position:absolute;inset:0;display:grid;place-items:center;}
  .thumb.checker{background:repeating-conic-gradient(#1c1c1c 0 25%,#101010 0 50%) 0 0/9px 9px;}
  .thumb .badge{position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;display:grid;place-items:center;
    background:#000;border:1px solid var(--stroke-2);border-radius:4px;color:var(--text-dim);z-index:2;}
  .thumb.mini{width:26px;height:26px;flex-basis:26px;}

  .meta{flex:1;min-width:0;}
  .name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row.sel .name{font-weight:650;}
  .subl{display:flex;align-items:center;gap:5px;margin-top:2px;font:400 10.5px/1.2 var(--mono);
    color:var(--text-faint);white-space:nowrap;overflow:hidden;}
  .subl b{font-weight:600;color:var(--text-dim);}
  .subl s{width:3px;height:3px;background:currentColor;opacity:.5;flex:0 0 3px;text-decoration:none;border-radius:50%;}
  .name input{width:100%;font:inherit;font-weight:600;color:var(--text);background:#000;
    border:1px solid #fff;border-radius:6px;padding:1px 7px;outline:none;}

  /* attached mask rows — dotted, mono uppercase (V1 .attach/.msk) */
  .row.msk{min-height:36px;background:rgba(255,255,255,.022);border:1px dotted rgba(255,255,255,.22);}
  .row.msk:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.32);}
  .row.msk.sel{background:var(--selected);border-style:solid;border-color:var(--stroke-2);}
  .row.msk .name{font:700 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);}
  .row.msk .ctag{background:repeating-linear-gradient(180deg,var(--c,#888) 0 2px,transparent 2px 6px);opacity:.9;}
  .attach{position:absolute;width:14px;align-self:stretch;pointer-events:none;}
  .row.msk .conn{position:relative;width:14px;flex:0 0 14px;align-self:stretch;pointer-events:none;}
  .row.msk .conn::before{content:"";position:absolute;left:5px;top:-9px;bottom:calc(50% - 1px);width:0;
    border-left:1px dotted rgba(255,255,255,.45);}
  .row.msk .conn::after{content:"";position:absolute;left:5px;top:calc(50% - 1px);width:12px;height:0;
    border-top:1px dotted rgba(255,255,255,.45);}
  .row.msk .conn i{position:absolute;left:15px;top:calc(50% - 2px);width:3px;height:3px;border-radius:50%;
    background:rgba(255,255,255,.5);}

  /* warning / caution badges (kit alert colours: red=warning, orange=caution) */
  .wico{width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center;cursor:help;
    animation:wpop .26s cubic-bezier(.34,1.5,.64,1) both;}
  @keyframes wpop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
  .wico.warning{color:var(--danger);} .wico.caution{color:#f76b15;}

  .eye{width:24px;height:24px;flex:0 0 24px;border:none;background:transparent;color:var(--text-dim);
    cursor:pointer;display:grid;place-items:center;opacity:.55;transition:color .15s var(--ease),opacity .15s;}
  .row:hover .eye,.row.sel .eye,.eye.off{opacity:1;}
  .eye:hover{color:var(--text);}
  .eye.off{color:#3a3a3a;}

  /* ── properties (unchanged language) ────────────────────────────── */
  .props-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:14px 20px 16px;}
  .props-scroll::-webkit-scrollbar{display:none;}
  .pcard{background:var(--inset);border-radius:var(--r-inset);padding:14px 16px 16px;margin-bottom:12px;
    animation:cardIn .28s var(--ease);}
  @keyframes cardIn{from{transform:translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
  .pcard h4{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-faint);margin-bottom:12px;}
  .prow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .prow:last-child{margin-bottom:0;}
  .prow .pl{flex:0 0 92px;font-size:11.5px;color:var(--text-dim);}

  .name-edit{font-size:12.5px;cursor:text;padding:4px 8px;margin:-4px -8px;border-radius:6px;
    transition:background .15s var(--ease);}
  .name-edit:hover{background:rgba(255,255,255,.05);}
  .name-edit input{background:var(--field);border:1px solid var(--hi);color:var(--text);
    font-size:12.5px;padding:2px 6px;outline:none;border-radius:0;width:180px;}

  .vec3{display:flex;gap:6px;flex:1;}
  .cell{flex:1;height:28px;border-radius:var(--r-pill);background:var(--field);
    display:flex;align-items:center;gap:6px;padding:0 10px;}
  .cell b{font-size:12px;font-weight:700;}
  .cell b.ax-x{color:var(--ax-x);} .cell b.ax-y{color:var(--ax-y);} .cell b.ax-z{color:var(--ax-z);}
  .cell input{flex:1;width:100%;min-width:0;background:transparent;border:none;color:var(--text);font-size:11.5px;outline:none;text-align:right;}

  .sldv{flex:0 0 96px;height:28px;border-radius:var(--r-pill);overflow:hidden;display:flex;align-items:stretch;}
  .sldv .num{flex:1;min-width:0;background:var(--field);color:var(--text);font-size:11.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;}
  .sldv .unit{flex:0 0 30px;background:var(--inset);color:var(--text-faint);font-size:10px;
    display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.06);}
  input.sld{flex:1;min-width:60px;appearance:none;-webkit-appearance:none;height:22px;border-radius:var(--r-pill);
    background:linear-gradient(to right,#7a7a7a 50%,var(--raised) 50%);outline:none;cursor:pointer;border:none;}
  input.sld::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:#e0e0e0;border:none;transition:transform .12s var(--ease);}
  input.sld:active::-webkit-slider-thumb{transform:scale(1.1);}
  input.sld::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#e0e0e0;border:none;}

  .sw{width:36px;height:20px;border-radius:var(--r-pill);background:#2c2c2c;position:relative;cursor:pointer;
    transition:background .2s var(--ease);flex:0 0 36px;}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#777;
    transition:left .2s var(--ease),background .2s var(--ease);}
  .sw.on{background:var(--accent);}
  .sw.on::after{left:19px;background:#000;}
  .seg{display:flex;background:var(--field);border-radius:var(--r-pill);padding:3px;flex:1;}
  .seg button{flex:1;height:24px;border:none;border-radius:var(--r-pill);background:transparent;color:var(--text-dim);
    font-size:10.5px;cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease);}
  .seg button.on{background:var(--accent);color:#000;font-weight:600;}
  .txt{flex:1;height:30px;border-radius:var(--r-pill);background:var(--field);border:none;color:var(--text);
    font-size:12px;padding:0 12px;outline:none;user-select:text;}
  .txt:focus{box-shadow:0 0 0 1px var(--hi);}

  /* colour swatches (V1 .sw i) */
  .swatches{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-items:center;}
  .swatch{width:18px;height:18px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.16);
    transition:transform .13s var(--ease),box-shadow .13s;}
  .swatch:hover{transform:scale(1.14);box-shadow:0 0 0 1px #fff;}
  .swatch.on{box-shadow:0 0 0 2px #fff;}

  /* channels — CPP accordion */
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 5px 0 10px;
    border-radius:var(--r-pill);background:#fff;color:#000;font-size:11px;font-weight:600;
    animation:chipIn .18s cubic-bezier(.34,1.4,.64,1) both;
  }
  @keyframes chipIn{from{opacity:0;transform:scale(.82);}to{opacity:1;transform:scale(1);}}
  .chip .cswatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .chip .cx{width:17px;height:17px;border-radius:50%;border:none;cursor:pointer;background:transparent;color:#000;
    font-size:10px;display:grid;place-items:center;transition:background .15s var(--ease),color .15s var(--ease),transform .15s var(--ease);}
  .chip .cx:hover{background:var(--danger);color:#fff;transform:rotate(90deg);}
  .add-btn{
    width:27px;height:27px;border-radius:50%;border:1px dashed #3a3a3a;background:transparent;
    color:var(--text-dim);cursor:pointer;font-size:14px;display:grid;place-items:center;
    transition:border-color .15s var(--ease),color .15s var(--ease);
  }
  .add-btn:hover{border-color:var(--accent);color:var(--text);}
  .chan-panel{background:var(--field);border:1px solid rgba(255,255,255,.06);border-radius:10px;margin-bottom:6px;overflow:hidden;}
  .chan-panel:last-child{margin-bottom:0;}
  .chan-head{display:flex;align-items:center;gap:8px;height:31px;padding:0 10px;cursor:pointer;
    transition:background .13s var(--ease);}
  .chan-head:hover{background:#141414;}
  .ch-tw{display:flex;align-items:center;justify-content:center;width:10px;height:10px;color:var(--text-faint);
    transition:transform .26s cubic-bezier(.34,1.5,.64,1);}
  .chan-panel.collapsed .ch-tw{transform:rotate(-90deg);}
  .ch-dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;
    transition:transform .22s cubic-bezier(.34,1.5,.64,1),opacity .2s;}
  .chan-panel.collapsed .ch-dot{transform:scale(.72);opacity:.5;}
  .ch-title{flex:1;font-size:11.5px;font-weight:600;}
  .ch-src{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--text-faint);
    transition:opacity .2s ease;}
  .chan-panel:not(.collapsed) .ch-src{opacity:.45;}
  .chan-shell{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s cubic-bezier(.4,0,.2,1);}
  .chan-panel.collapsed .chan-shell{grid-template-rows:0fr;transition:grid-template-rows .22s cubic-bezier(.4,0,.2,1);}
  .chan-clip{overflow:hidden;min-height:0;}
  .chan-body{padding:8px 10px 10px;transition:opacity .24s ease .04s;}
  .chan-panel.collapsed .chan-body{opacity:0;}
  .chan-body .prow .pl{flex-basis:70px;}
  .chan-body .sldv .num{background:#121212;}
  .colorbar{display:flex;align-items:center;gap:8px;flex:1;height:26px;padding:0 10px 0 4px;
    background:#161616;border:1px solid rgba(255,255,255,.07);border-radius:var(--r-pill);cursor:pointer;
    transition:border-color .15s var(--ease);}
  .colorbar:hover{border-color:rgba(255,255,255,.16);}
  .chip-round{flex:0 0 18px;height:18px;border-radius:50%;}
  .cname{flex:1;font-size:11px;letter-spacing:.4px;text-transform:uppercase;font-variant-numeric:tabular-nums;}
  .pickbar{display:flex;align-items:center;gap:8px;flex:1;height:26px;padding:0 6px 0 10px;
    background:#161616;border:1px solid rgba(255,255,255,.07);border-radius:var(--r-pill);cursor:pointer;
    transition:border-color .15s var(--ease);}
  .pickbar:hover{border-color:rgba(255,255,255,.16);}
  .pickbar .pname{flex:1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pickbar .caret{color:var(--text-faint);font-size:9px;}
  .gen-params{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06);
    animation:rise .22s cubic-bezier(.4,0,.2,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:none;}}
  .slot{display:flex;align-items:center;gap:9px;padding:6px;background:#161616;
    border:1px solid rgba(255,255,255,.07);border-radius:9px;}
  .slot-thumb{flex:0 0 34px;height:34px;border-radius:6px;display:grid;place-items:center;color:#000;}
  .slot-text{flex:1;min-width:0;}
  .slot-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slot-meta{font-size:9.5px;color:var(--text-faint);margin-top:2px;font-variant-numeric:tabular-nums;}

  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--text-faint);font-size:12px;}

  /* alert card in details (kit alert style) */
  .alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:12px;
    animation:cardIn .28s var(--ease);}
  .alert svg{flex:0 0 15px;margin-top:1px;}
  .alert .at{font-size:11px;color:var(--text-dim);line-height:1.45;}
  .alert .at b{display:block;font:700 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px;}
  .alert.warning{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);}
  .alert.warning .at b{color:var(--danger);}
  .alert.caution{background:rgba(247,107,21,.08);border:1px solid rgba(247,107,21,.35);}
  .alert.caution .at b{color:#f76b15;}

  .det-hero{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .det-hero .di{width:44px;height:44px;flex:0 0 44px;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.15);}
  .det-hero .dn{font-size:13.5px;font-weight:600;}
  .det-hero .dt{font:400 10.5px/1.2 var(--mono);color:var(--text-faint);margin-top:3px;}
  .det-open-hint{font-size:11px;color:var(--text-faint);text-align:center;padding:10px 0 2px;}
  .mini-chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;}
  .mini-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--r-pill);
    background:var(--raised);font-size:10.5px;}
  .mini-chip i{width:7px;height:7px;border-radius:50%;}

  /* big square preview in layer settings */
  .bigprev{position:relative;width:128px;height:128px;margin:2px auto 14px;
    box-shadow:0 0 0 1px rgba(255,255,255,.16);animation:cardIn .28s var(--ease);}
  .bigprev .tv{position:absolute;inset:0;display:grid;place-items:center;}
  .bigprev.checker{background:repeating-conic-gradient(#1c1c1c 0 25%,#101010 0 50%) 0 0/12px 12px;}
  .bigprev .pv-badge{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;display:grid;place-items:center;
    background:#000;border:1px solid var(--stroke-2);border-radius:6px;color:var(--text-dim);z-index:2;}

  .menu{position:fixed;z-index:900;min-width:200px;background:#0b0b0b;border:1px solid var(--stroke-2);
    border-radius:16px;box-shadow:0 24px 60px -14px #000;padding:5px;display:none;animation:menuIn .16s var(--ease);
    max-height:340px;overflow-y:auto;scrollbar-width:none;}
  .menu::-webkit-scrollbar{display:none;}
  @keyframes menuIn{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .menu.show{display:block;}
  .menu .mh{font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);padding:9px 10px 7px;}
  .menu .mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-pill);cursor:pointer;
    font-size:12px;color:var(--text-dim);transition:background .12s,color .12s;}
  .menu .mi:hover{background:rgba(255,255,255,.09);color:var(--text);}
  .menu .mi.dis{opacity:.35;pointer-events:none;}
  .menu .mi .swd{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .menu .mi .note{margin-left:auto;font:500 10px/1 var(--mono);color:var(--text-faint);}
  .menu .msep{height:1px;background:var(--stroke);margin:5px 8px;}
  svg{display:block;}
</style>
</head>
<body>

<div class="card">
  <div class="card-head">
    <button class="iconbtn" id="btnBack" title="Back to stack" style="display:none">‹</button>
    <span class="h-title" id="hTitle">Layer Stack</span>
    <span class="h-sub" id="hSub">Material · M_Hull_Painted</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnAdd" title="Add layer">＋</button>
    <button class="iconbtn props" id="btnProps" title="Open properties" disabled>›</button>
  </div>

  <div class="view-wrap">
    <div class="view-track" id="viewTrack">
      <!-- view 0 : [ stack | details ] -->
      <div class="view">
        <div class="tree-pane">
          <div class="tools">
            <label class="search">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5c5c5c" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="q" placeholder="Filter layers…" spellcheck="false">
            </label>
            <button class="tico" id="btnFilter" title="Filter by type">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>
            </button>
            <button class="tico" id="btnFolder" title="New folder">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
            </button>
          </div>
          <div class="filter-row" id="filterRow"></div>
          <div class="divider"></div>
          <div class="tree" id="tree"></div>
        </div>
        <div class="det-pane" id="details"></div>
      </div>
      <!-- view 1 : properties -->
      <div class="view">
        <div class="props-scroll" id="props"></div>
      </div>
    </div>
  </div>

  <div class="card-foot">
    <span id="footInfo">—</span>
    <span class="spacer"></span>
    <span id="footSel">0 selected</span>
  </div>
</div>

<div class="menu" id="popMenu"></div>
<div class="menu" id="ctxMenu"></div>

<script>
(()=>{ "use strict";
const S=(p,c,sz)=>`<svg width="${sz||14}" height="${sz||14}" viewBox="0 0 24 24" fill="none" stroke="${c||'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const PATHS={
  paint  :'<path d="M18 3a3 3 0 0 1 3 3c0 6-6 4-8 8-1.5 3 0 7-4 7a6 6 0 0 1-6-6C3 7 12 3 18 3z"/><circle cx="7.5" cy="14.5" r="1"/><circle cx="10" cy="9.5" r="1"/><circle cx="15" cy="7.5" r="1"/>',
  fill   :'<path d="m7 2 10 10-8 8L2 13z"/><path d="M20 15s2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4z"/>',
  decal  :'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 13 2.5 3L14 11l4 6H6z"/>',
  text   :'<path d="M4 6V4h16v2M12 4v16M9 20h6"/>',
  svg    :'<path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/>',
  pattern:'<path d="M12 3 4.5 7.5v9L12 21l7.5-4.5v-9z"/><path d="M12 3v9m0 0-7.5 4.5M12 12l7.5 4.5"/>',
  folder :'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  mask   :'<path d="M3 8c0-1.8 4-3.5 9-3.5S21 6.2 21 8c0 5.5-3.2 10-6.2 10-1.6 0-2-1.4-2.8-1.4S10 18 8.2 18C5.2 18 3 13.5 3 8z"/><path d="M7 10.2c1.3-1 2.8-1 4 .2M13 10.4c1.2-1.2 2.7-1.2 4-.2"/>',
  brush  :'<path d="m15 4 5 5-9.5 9.5a3 3 0 0 1-2.1.9H5v-3.4a3 3 0 0 1 .9-2.1z"/>',
  stack  :'<path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/>',
  eye    :'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff :'<path d="M2 12s3.5-7 10-7c2 0 3.8.7 5.3 1.6M22 12s-3.5 7-10 7c-2 0-3.8-.7-5.3-1.6"/><path d="m3 3 18 18"/>',
  chevd  :'<polyline points="6 9 12 15 18 9"/>',
  warn   :'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
};
/* LayerstackV1 colour tags */
const COLORS=['#e5484d','#f76b15','#ffc53d','#46a758','#12a594','#8ab4d8','#9b8cf0','#e93d82','#8b8d98','#b0e64c'];

/* thumb visual per type (checker + colour art + badge) */
function thumbHTML(n,mini){
  const c=n.color||'#8b8d98';
  let art='', badge=PATHS[n.type==='decal'?(n.decal||'decal'):n.type]||PATHS.stack;
  if(n.type==='mask'){
    return `<div class="thumb mini" style="background:#000"><span class="tv" style="background:radial-gradient(circle at 50% 45%,#fff 0 26%,#666 40%,#000 75%)"></span><span class="badge">${S(PATHS.mask,null,9)}</span></div>`;
  }
  if(n.type==='folder'){
    return `<div class="thumb" style="background:#0a0a0a"><span class="tv">${S(PATHS.folder,c,17)}</span></div>`;
  }
  if(n.type==='paint') art=`background:radial-gradient(circle at 30% 38%,${c}d9 0 24%,transparent 27%),radial-gradient(circle at 68% 62%,${c}88 0 20%,transparent 23%),radial-gradient(circle at 55% 25%,${c}66 0 12%,transparent 15%)`;
  else if(n.type==='fill') art=`background:linear-gradient(135deg,${c} 0%,${c}aa 100%)`;
  else if(n.type==='decal'&&n.decal==='pattern') art=`background:repeating-linear-gradient(60deg,${c}cc 0 2px,transparent 2px 8px),repeating-linear-gradient(-60deg,${c}88 0 2px,transparent 2px 8px)`;
  else art=''; /* text/svg/image decal: icon on checker */
  const inner=art?`<span class="tv" style="${art}"></span>`
                 :`<span class="tv">${S(PATHS[n.decal]||PATHS.decal,c,15)}</span>`;
  return `<div class="thumb ${mini?'mini ':''}checker">${inner}<span class="badge">${S(badge,null,9)}</span></div>`;
}

/* big square preview (details — layer settings) */
function bigPrevHTML(n){
  const c=n.color||'#8b8d98';
  const badge=`<span class="pv-badge">${S(PATHS[n.type==='decal'?(n.decal||'decal'):n.type]||PATHS.stack,null,11)}</span>`;
  if(n.type==='mask')
    return `<div class="bigprev" style="background:#000"><span class="tv" style="background:radial-gradient(circle at 42% 40%,#fff 0 18%,#888 34%,#222 62%,#000 80%)"></span>${badge}</div>`;
  if(n.type==='folder')
    return `<div class="bigprev" style="background:#0a0a0a"><span class="tv">${S(PATHS.folder,c,42)}</span></div>`;
  if(n.type==='decal'&&n.decal==='text')
    return `<div class="bigprev checker"><span class="tv" style="font:700 13px/1.3 var(--mono);color:${c};letter-spacing:.06em;padding:10px;text-align:center;word-break:break-word">${n.text||'TEXT'}</span>${badge}</div>`;
  let art='';
  if(n.type==='paint') art=`background:radial-gradient(circle at 30% 38%,${c}d9 0 24%,transparent 27%),radial-gradient(circle at 68% 62%,${c}88 0 20%,transparent 23%),radial-gradient(circle at 55% 25%,${c}66 0 12%,transparent 15%),radial-gradient(circle at 24% 74%,${c}55 0 14%,transparent 17%)`;
  else if(n.type==='fill') art=`background:linear-gradient(135deg,${c} 0%,${c}aa 100%)`;
  else if(n.type==='decal'&&n.decal==='pattern') art=`background:repeating-linear-gradient(60deg,${c}cc 0 3px,transparent 3px 12px),repeating-linear-gradient(-60deg,${c}88 0 3px,transparent 3px 12px)`;
  const inner=art?`<span class="tv" style="${art}"></span>`
                 :`<span class="tv">${S(PATHS[n.decal]||PATHS.decal,c,38)}</span>`;
  return `<div class="bigprev checker">${inner}${badge}</div>`;
}

/* ── channels (CPP schema) ────────────────────────────────────────── */
const CH_LIST=[
  {id:'base',  name:'Base Colour', hue:'#b87333', group:'Surface',    kind:'colour'},
  {id:'rough', name:'Roughness',   hue:'#3b82f6', group:'Surface',    kind:'scalar', def:55},
  {id:'metal', name:'Metallic',    hue:'#8b5cf6', group:'Surface',    kind:'scalar', def:10},
  {id:'height',name:'Height',      hue:'#8a8a8a', group:'Surface',    kind:'scalar', def:50},
  {id:'norm',  name:'Normal',      hue:'#10b981', group:'Surface',    kind:'scalar', def:100},
  {id:'opac',  name:'Opacity',     hue:'#94a3b8', group:'Surface',    kind:'scalar', def:100},
  {id:'emis',  name:'Emissive',    hue:'#f59e0b', group:'Radiance',   kind:'colour'},
  {id:'ao',    name:'Ambient Occ', hue:'#6b7280', group:'Radiance',   kind:'scalar', def:80},
];
const CH=id=>CH_LIST.find(c=>c.id===id);
const CH_GROUPS=['Surface','Radiance'];
const SOURCES=['Value','Paint','Generator'];
const GENS=[
  {group:'Wear'},
  {key:'EdgeWear', label:'Edge Wear',   note:'Curvature wear', params:[['Intensity',60],['Softness',30]]},
  {key:'Dirt',     label:'Dirt',        note:'Occlusion dirt', params:[['Amount',50],['Scale',30]]},
  {group:'Procedural'},
  {key:'Perlin',   label:'Perlin Noise',note:'Fractal noise',  params:[['Scale',40],['Contrast',50]]},
  {key:'Voronoi',  label:'Voronoi',     note:'Cellular',       params:[['Density',35],['Jitter',70]]},
];
const GEN=key=>GENS.find(g=>g.key===key);

/* ── model — folders + layers + mask child nodes ──────────────────── */
let UID=0;
function chDefaults(ids){
  const o={};
  (ids||[]).forEach(id=>{const c=CH(id);o[id]={src:'Value',val:c.def??50,color:c.id==='emis'?'#ff5a3c':'#b87333',gen:'EdgeWear'};});
  return o;
}
const L=(name,type,extra)=>{
  const e=extra||{};
  const channels=e.channels||['base','rough','metal'];
  return {id:++UID,name,type,kids:e.kids||[],open:true,vis:true,opacity:e.opacity??100,blend:e.blend||'Normal',
    res:e.res||'2048 × 2048',warn:e.warn||null,
    color:e.color||COLORS[UID%COLORS.length],channels,chan:chDefaults(channels),chOpen:{},decal:e.decal,text:e.text};
};
const F=(name,color,kids)=>({id:++UID,name,type:'folder',kids:kids||[],open:true,vis:true,opacity:100,blend:'Passthrough',
  warn:null,color:color||'#8ab4d8',channels:[],chan:{},chOpen:{}});
const M=name=>({id:++UID,name,type:'mask',kids:[],open:true,vis:true,invert:false,feather:12,density:100,src:'Paint',
  blend:'Multiply',warn:null,color:'#8b8d98'});

const stack=[
  F('Decals','#8ab4d8',[
    L('Decal_SerialText','decal',{decal:'text',text:'HULL-7741-A',channels:['base','rough'],color:'#8ab4d8'}),
    L('Decal_Insignia','decal',{decal:'image',channels:['base','norm'],color:'#9b8cf0',
      warn:{lvl:'caution',msg:'Source image not found — rendering placeholder.'}}),
    L('Pattern_HexPanel','decal',{decal:'pattern',channels:['base','rough','norm'],color:'#12a594',
      warn:{lvl:'warning',msg:'Resolution mismatch — layer is 2048² but material budget is 4096².'}}),
  ]),
  F('Paint','#f76b15',[
    L('Paint_Weathering','paint',{channels:['base','rough','height'],color:'#f76b15'}),
    L('Paint_EdgeHighlights','paint',{channels:['base'],color:'#ffc53d',opacity:70,blend:'Add'}),
  ]),
  L('Fill_BaseSteel','fill',{channels:['base','rough','metal','ao'],color:'#8b8d98',res:'4096 × 4096'}),
];
stack[0].kids[0].kids.push(M('Mask_Fade'));
stack[1].kids[0].kids.push(M('Mask_EdgeWear'));
stack[2].kids.push(M('Mask_Dirt'));

const TYPE_LABEL={paint:'Paint',fill:'Fill',decal:'Decal',mask:'Mask',folder:'Folder'};
const DECAL_LABEL={text:'Text Decal',svg:'SVG Decal',image:'Image Decal',pattern:'Pattern Decal'};
const typeLabel=n=>n.type==='decal'?DECAL_LABEL[n.decal]:TYPE_LABEL[n.type];
const filterKey=n=>n.type==='decal'?(n.decal==='pattern'?'Pattern':'Decal'):TYPE_LABEL[n.type];
const FILTER_TYPES=['Folder','Paint','Fill','Decal','Pattern','Mask'];

const flat=[]; const walk=(l,d,p)=>l.forEach(n=>{n.depth=d;n.parent=p;flat.push(n);walk(n.kids,d+1,n);});
const reflat=()=>{flat.length=0;walk(stack,0,null);};

let selId=null; let view=0; let query=''; const filters=new Set();
const current=()=>flat.find(x=>x.id===selId)||null;
const isDescendant=(anc,x)=>{ let p=x.parent; while(p){ if(p===anc) return true; p=p.parent; } return false; };

/* ── whole-card slide ─────────────────────────────────────────────── */
const viewTrack=document.getElementById('viewTrack');
const btnProps=document.getElementById('btnProps'), btnBack=document.getElementById('btnBack'), btnAdd=document.getElementById('btnAdd');
const hTitle=document.getElementById('hTitle'), hSub=document.getElementById('hSub');
function viewTo(i){
  view=i;
  viewTrack.style.transform=`translateX(-${i*50}%)`;
  const n=current();
  if(i===1&&n){
    hTitle.textContent=n.name; hSub.textContent=typeLabel(n)+(n.type==='mask'?' Properties':' Layer');
    btnBack.style.display=''; btnProps.style.display='none'; btnAdd.style.display='none';
  }else{
    hTitle.textContent='Layer Stack'; hSub.textContent='Material · M_Hull_Painted';
    btnBack.style.display='none'; btnProps.style.display=''; btnAdd.style.display='';
  }
}
btnProps.addEventListener('click',()=>{ if(current()){ renderProps(); viewTo(1); } });
btnBack.addEventListener('click',()=>{ viewTo(0); renderTree(); renderDetails(); });

/* ── rename ───────────────────────────────────────────────────────── */
function startRename(n,nmEl,after){
  nmEl.innerHTML=`<input value="${n.name.replace(/"/g,'&quot;')}">`;
  const inp=nmEl.querySelector('input'); inp.focus(); inp.select();
  const done=ok=>{ if(ok&&inp.value.trim()) n.name=inp.value.trim(); after(); };
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter')done(true); if(ev.key==='Escape')done(false); });
  inp.addEventListener('blur',()=>done(true));
  inp.addEventListener('pointerdown',e=>e.stopPropagation());
}

/* ── filter logic (search + type pills) ───────────────────────────── */
function passFilter(n){
  const typeOk=!filters.size||filters.has(filterKey(n));
  const nameOk=!query||n.name.toLowerCase().includes(query);
  if(typeOk&&nameOk) return true;
  return n.kids.some(passFilter);
}
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.trim().toLowerCase(); renderTree(); });

/* ── stack render (in-place selection so dblclick works) ──────────── */
const treeEl=document.getElementById('tree');
const dropLine=document.createElement('div'); dropLine.className='dropline';
let rowIndex=[];
function updateSel(){
  rowIndex.forEach(({n,row})=>row.classList.toggle('sel',n.id===selId));
  document.getElementById('footSel').textContent=current()?current().name:'0 selected';
  btnProps.disabled=!current();
}
function subLine(n){
  if(n.type==='mask') return '';
  if(n.type==='folder') return `<div class="subl"><b>folder</b><s></s>${n.kids.length} items</div>`;
  const bits=[`<b>${typeLabel(n).toLowerCase()}</b>`];
  bits.push(`${n.channels.length} ch`);
  bits.push(`${n.opacity}%`);
  if(n.kids.some(k=>k.type==='mask')) bits.push('mask');
  return `<div class="subl">${bits.join('<s></s>')}</div>`;
}
function renderTree(){
  reflat(); treeEl.innerHTML=''; rowIndex=[];
  treeEl.appendChild(dropLine);
  const build=list=>{
    list.forEach(n=>{
      if(!passFilter(n)) return;
      const isMask=n.type==='mask';
      const row=document.createElement('div');
      row.className='row'+(n.id===selId?' sel':'')+(isMask?' msk':'')+(n.vis?'':' off');
      row.style.setProperty('--c',isMask?(n.parent?n.parent.color:'#888'):n.color);
      row.style.marginLeft=(n.depth*16)+'px';
      const leaf=!n.kids.length;
      row.innerHTML=
        `<span class="ctag"></span>`+
        (isMask?'<span class="conn"><i></i></span>'
               :`<button class="tw ${leaf?'void':''} ${n.open?'':'closed'}">${S(PATHS.chevd,null,11)}</button>`)+
        thumbHTML(n,isMask)+
        `<div class="meta"><div class="name" data-nm>${n.name}</div>${subLine(n)}</div>`+
        (n.warn?`<span class="wico ${n.warn.lvl}" title="${n.warn.msg.replace(/"/g,'&quot;')}">${S(PATHS.warn,null,13)}</span>`:'')+
        `<button class="eye ${n.vis?'':'off'}">${n.vis?S(PATHS.eye,null,13):S(PATHS.eyeoff,null,13)}</button>`;
      const tw=row.querySelector('.tw');
      if(tw&&!leaf) tw.addEventListener('click',e=>{e.stopPropagation();n.open=!n.open;renderTree();});
      row.querySelector('.eye').addEventListener('click',e=>{e.stopPropagation();n.vis=!n.vis;renderTree();renderDetails();});
      row.addEventListener('click',()=>{ if(dragMoved){dragMoved=false;return;} selId=n.id; updateSel(); renderDetails(); });
      row.addEventListener('dblclick',e=>{
        if(e.target.closest('.tw,.eye')) return;
        startRename(n,row.querySelector('[data-nm]'),()=>{renderTree();renderDetails();});
      });
      row.addEventListener('contextmenu',e=>{
        e.preventDefault(); selId=n.id; updateSel(); renderDetails(); openCtx(e.clientX,e.clientY,n);
      });
      row.addEventListener('pointerdown',e=>{ if(e.button===0&&!e.target.closest('.tw,.eye,input')) dragStart(e,n,row); });
      treeEl.appendChild(row);
      rowIndex.push({n,row});
      if(!leaf&&n.open) build(n.kids);
    });
  };
  build(stack);
  const layers=flat.filter(n=>n.type!=='mask'&&n.type!=='folder').length;
  const masks=flat.filter(n=>n.type==='mask').length;
  const folders=flat.filter(n=>n.type==='folder').length;
  document.getElementById('footInfo').textContent=`${layers} layers · ${folders} folders · ${masks} masks`;
  updateSel();
}

/* ── drag: reorder + parenting (folders & layers accept children) ─── */
let drag=null, dragMoved=false;
function dragStart(e,n,row){
  drag={n,row,x0:e.clientX,y0:e.clientY,started:false,target:null,zone:null};
  const mv=ev=>dragMove(ev), up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);dragEnd();};
  addEventListener('pointermove',mv); addEventListener('pointerup',up);
}
function dragMove(e){
  if(!drag) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6) return;
    drag.started=true; dragMoved=true; drag.row.classList.add('dragging');
  }
  rowIndex.forEach(({row})=>row.classList.remove('drop-into'));
  dropLine.style.display='none'; drag.target=null; drag.zone=null;
  for(const ent of rowIndex){
    if(ent.n===drag.n||isDescendant(drag.n,ent.n)) continue;
    const r=ent.row.getBoundingClientRect();
    if(e.clientY<r.top||e.clientY>r.bottom) continue;
    const t=(e.clientY-r.top)/r.height;
    const canInto=drag.n.type!=='mask'&&ent.n.type!=='mask';
    if(canInto&&t>0.3&&t<0.7){ drag.target=ent; drag.zone='into'; ent.row.classList.add('drop-into'); }
    else{
      drag.target=ent; drag.zone=t<0.5?'before':'after';
      const tr=treeEl.getBoundingClientRect();
      dropLine.style.top=((drag.zone==='before'?r.top:r.bottom)-tr.top+treeEl.scrollTop-1)+'px';
      dropLine.style.display='block';
    }
    break;
  }
}
function dragEnd(){
  if(!drag) return;
  const d=drag; drag=null;
  d.row.classList.remove('dragging');
  rowIndex.forEach(({row})=>row.classList.remove('drop-into'));
  dropLine.style.display='none';
  if(!d.started||!d.target) return;
  const n=d.n, t=d.target.n;
  const srcArr=n.parent?n.parent.kids:stack;
  const si=srcArr.indexOf(n); if(si>-1) srcArr.splice(si,1);
  if(d.zone==='into'){ t.kids.push(n); t.open=true; }
  else{
    const dstArr=t.parent?t.parent.kids:stack;
    if(n.type==='mask'&&!t.parent){ t.kids.unshift(n); }  /* masks must live under a layer */
    else dstArr.splice(dstArr.indexOf(t)+(d.zone==='after'?1:0),0,n);
  }
  renderTree(); renderDetails();
}

/* ── details pane — settings of the selected component ────────────── */
const detEl=document.getElementById('details');
const BLENDS=['Normal','Multiply','Screen','Overlay','Add','Subtract','Darken','Lighten'];
const MASK_BLENDS=['Multiply','Add','Subtract'];
const RES_OPTS=['512 × 512','1024 × 1024','2048 × 2048','4096 × 4096','Match material'];
const rowPick=(l,v,key)=>`<div class="prow"><span class="pl">${l}</span><div class="pickbar" data-dd="${key}"><span class="pname">${v}</span><span class="caret">▾</span></div></div>`;
const rowSlideF=(l,val,min,max,u,f)=>rowSlider(l,val,min,max,u).replace('class="sld"',`class="sld" data-f="${f}"`);
const enabledRow=n=>`<div class="prow"><span class="pl">Enabled</span><div class="sw ${n.vis?'on':''}" id="detVis"></div><span style="flex:1"></span></div>`;

/* shared dropdown (pickbar) wiring — details pane + properties slide */
function wireDD(root,n,after){
  root.querySelectorAll('[data-dd]').forEach(pb=>pb.addEventListener('click',e=>{
    e.stopPropagation();
    const key=pb.dataset.dd;
    const opts=key==='res'?RES_OPTS:key==='mblend'?MASK_BLENDS:key==='fblend'?['Passthrough',...BLENDS]:BLENDS;
    const cur=key==='res'?n.res:n.blend;
    popMenu.innerHTML=`<div class="mh">${key==='res'?'Resolution':'Blend mode'}</div>`+
      opts.map(o=>`<div class="mi" data-o="${o}">${o}${o===cur?'<span class="note">✓</span>':''}</div>`).join('');
    popMenu.querySelectorAll('[data-o]').forEach(mi=>mi.addEventListener('click',()=>{
      if(key==='res') n.res=mi.dataset.o; else n.blend=mi.dataset.o;
      closeMenus(); after();
    }));
    const r=pb.getBoundingClientRect();
    place(popMenu,r.left,r.bottom+6);
  }));
}

function renderDetails(){
  const n=current();
  if(!n){
    detEl.innerHTML=`<div class="empty">${S(PATHS.stack)}<span>Select a layer to inspect it</span></div>`;
    return;
  }
  const mask=n.kids.find(k=>k.type==='mask');
  const alertHTML=n.warn
    ?`<div class="alert ${n.warn.lvl}">${S(PATHS.warn,n.warn.lvl==='warning'?'#ef4444':'#f76b15',15)}<div class="at"><b>${n.warn.lvl}</b>${n.warn.msg}</div></div>`
    :'';
  let settings;
  if(n.type==='mask'){
    settings=card('Mask Settings',
      bigPrevHTML(n)+
      enabledRow(n)+
      rowPick('Blend',n.blend,'mblend')+
      rowSlideF('Density',n.density,0,100,'%','density')+
      rowSlideF('Feather',n.feather,0,64,' px','feather')+
      `<div class="prow"><span class="pl">Invert</span><div class="sw ${n.invert?'on':''}" id="detInv"></div><span style="flex:1"></span></div>`+
      rowText('Masking',n.parent?n.parent.name:'—')+
      rowText('Source',n.src));
  }else if(n.type==='folder'){
    settings=card('Folder Settings',
      bigPrevHTML(n)+
      enabledRow(n)+
      rowPick('Blend mode',n.blend,'fblend')+
      rowSlideF('Opacity',n.opacity,0,100,'%','opacity')+
      rowText('Items',String(n.kids.length)));
  }else{
    settings=card('Layer Settings',
      bigPrevHTML(n)+
      enabledRow(n)+
      rowPick('Blend mode',n.blend,'blend')+
      rowSlideF('Opacity',n.opacity,0,100,'%','opacity')+
      rowPick('Resolution',n.res,'res')+
      rowText('Mask',mask?mask.name:'none')+
      `<div class="prow"><span class="pl">Channels</span><div class="mini-chips">${
        n.channels.map(id=>{const c=CH(id);return `<span class="mini-chip"><i style="background:${c.hue}"></i>${c.name}</span>`;}).join('')
      }</div></div>`);
  }
  detEl.innerHTML=
    `<div class="det-hero">${thumbHTML(n)}
      <div><div class="dn name-edit" id="detName" title="Double-click to rename">${n.name}</div>
      <div class="dt">${typeLabel(n).toLowerCase()}${n.type!=='mask'?` · ${n.blend.toLowerCase()} · ${n.opacity}%`:` · ${n.blend.toLowerCase()} · ${n.density}%`}${n.kids.length?` · ${n.kids.length} children`:''}</div></div></div>`+
    alertHTML+settings+
    `<div class="det-open-hint">Press &nbsp;<b style="color:var(--text)">›</b>&nbsp; in the header for full properties</div>`;
  document.getElementById('detVis').addEventListener('click',()=>{n.vis=!n.vis;renderTree();renderDetails();});
  const dn=document.getElementById('detName');
  dn.addEventListener('dblclick',()=>startRename(n,dn,()=>{renderTree();renderDetails();}));
  const inv=document.getElementById('detInv');
  if(inv) inv.addEventListener('click',()=>{n.invert=!n.invert;renderDetails();});
  detEl.querySelectorAll('.sld').forEach(s=>{
    wireSlider(s);
    const f=s.dataset.f;
    if(f){ s.addEventListener('input',()=>{n[f]=+s.value;}); s.addEventListener('change',()=>{renderTree();renderDetails();}); }
  });
  wireDD(detEl,n,()=>{renderDetails();renderTree();});
}

/* ── popups ───────────────────────────────────────────────────────── */
const popMenu=document.getElementById('popMenu'), ctxMenu=document.getElementById('ctxMenu');
function place(menu,x,y){
  menu.classList.add('show');
  const r=menu.getBoundingClientRect();
  let px=x, py=y;
  if(py+r.height>innerHeight-10) py=Math.max(10,y-r.height);
  if(px+r.width>innerWidth-10)  px=innerWidth-10-r.width;
  menu.style.left=px+'px'; menu.style.top=py+'px';
}
function closeMenus(){popMenu.classList.remove('show');ctxMenu.classList.remove('show');}
addEventListener('pointerdown',e=>{ if(!e.target.closest('.menu')) closeMenus(); });
addEventListener('blur',closeMenus);

/* type filter pills */
document.getElementById('btnFilter').addEventListener('click',e=>{
  e.stopPropagation();
  const opts=FILTER_TYPES.filter(t=>!filters.has(t));
  popMenu.innerHTML=`<div class="mh">Filter by type</div>`+
    (opts.length?opts.map(t=>`<div class="mi" data-t="${t}">${t}</div>`).join(''):'<div class="mi dis">All filters active</div>');
  popMenu.querySelectorAll('[data-t]').forEach(mi=>mi.addEventListener('click',()=>{
    filters.add(mi.dataset.t); closeMenus(); renderFilters(); renderTree();
  }));
  const r=e.currentTarget.getBoundingClientRect();
  place(popMenu,r.left,r.bottom+6);
});
function renderFilters(){
  const row=document.getElementById('filterRow');
  row.innerHTML='';
  filters.forEach(t=>{
    const p=document.createElement('div'); p.className='pill';
    p.innerHTML=`${t}<button class="px">✕</button>`;
    p.querySelector('.px').addEventListener('click',()=>{filters.delete(t);renderFilters();renderTree();});
    row.appendChild(p);
  });
}
/* new folder */
document.getElementById('btnFolder').addEventListener('click',()=>{
  const f=F('New_Folder',COLORS[(UID+3)%COLORS.length]);
  stack.unshift(f); selId=f.id; renderTree(); renderDetails();
});
/* add-layer menu */
btnAdd.addEventListener('click',e=>{
  e.stopPropagation();
  popMenu.innerHTML=
    `<div class="mh">Add Layer</div>`+
    `<div class="mi" data-t="paint">${S(PATHS.paint,'#f76b15')} Paint <span class="note">PBR paint</span></div>`+
    `<div class="mi" data-t="fill">${S(PATHS.fill,'#9b8cf0')} Fill <span class="note">material</span></div>`+
    `<div class="mi" data-t="folder">${S(PATHS.folder,'#8ab4d8')} Folder <span class="note">group</span></div>`+
    `<div class="msep"></div><div class="mh">Decal</div>`+
    `<div class="mi" data-t="text">${S(PATHS.text,'#8ab4d8')} Text</div>`+
    `<div class="mi" data-t="svg">${S(PATHS.svg,'#8ab4d8')} SVG</div>`+
    `<div class="mi" data-t="image">${S(PATHS.decal,'#8ab4d8')} Image</div>`+
    `<div class="mi" data-t="pattern">${S(PATHS.pattern,'#12a594')} Pattern generator</div>`;
  popMenu.querySelectorAll('.mi').forEach(mi=>mi.addEventListener('click',()=>{

    let nl;
    if(t==='folder') nl=F('New_Folder');
    else if(t==='paint'||t==='fill') nl=L('New_'+TYPE_LABEL[t],t);
    else nl=L('New_'+DECAL_LABEL[t].replace(' ','_'),'decal',{decal:t,text:t==='text'?'TEXT':undefined});
    stack.unshift(nl); selId=nl.id; renderTree(); renderDetails();
  }));
  const r=e.currentTarget.getBoundingClientRect();

});
function openCtx(x,y,n){
  const isMask=n.type==='mask', isFolder=n.type==='folder';
  const hasMask=n.kids.some(k=>k.type==='mask');
  ctxMenu.innerHTML=
    `<div class="mh">${n.name}</div>`+
    `<div class="mi" data-a="props">Properties…</div>`+
    (!isMask&&!isFolder?`<div class="mi ${hasMask?'dis':''}" data-a="mask">${S(PATHS.mask)} Add mask</div>`:'')+
    (!isMask?`<div class="mi" data-a="dup">Duplicate</div>`:'')+
    (isFolder?`<div class="mi" data-a="group">Ungroup</div>`:'')+
    `<div class="mi" data-a="vis">${n.vis?'Disable':'Enable'}</div>`+
    `<div class="msep"></div>`+
    `<div class="mi" data-a="del" style="color:var(--danger)">${isMask?'Remove mask':(isFolder?'Delete folder':'Delete layer')}</div>`;
  ctxMenu.querySelectorAll('.mi').forEach(mi=>mi.addEventListener('click',()=>{
    const a=mi.dataset.a; closeMenus();
    if(a==='props'){ renderProps(); viewTo(1); return; }
    if(a==='vis'){ n.vis=!n.vis; }
    if(a==='mask'&&!hasMask){ const m=M('Mask_'+n.name.split('_').pop()); n.kids.unshift(m); n.open=true; selId=m.id; }
    if(a==='dup'){ const arr=n.parent?n.parent.kids:stack; const i=arr.indexOf(n);
      arr.splice(i,0,n.type==='folder'?F(n.name+'_Copy',n.color):L(n.name+'_Copy',n.type,{decal:n.decal,text:n.text,channels:[...n.channels],color:n.color})); }
    if(a==='group'){ const arr=n.parent?n.parent.kids:stack; const i=arr.indexOf(n);
      arr.splice(i,1,...n.kids.map(k=>{k.parent=n.parent;return k;})); }
    if(a==='del'){ const arr=n.parent?n.parent.kids:stack; const i=arr.indexOf(n); if(i>-1)arr.splice(i,1);
      if(selId===n.id){ selId=null; if(view===1)viewTo(0); } }
    renderTree(); renderDetails();
  }));
  place(ctxMenu,x,y);
}

/* ── property builders ────────────────────────────────────────────── */
const esc=s=>String(s??'').replace(/"/g,'&quot;');
const card=(t,i)=>`<div class="pcard"><h4>${t}</h4>${i}</div>`;
const AXES=[['X','ax-x'],['Y','ax-y'],['Z','ax-z']];
const rowVec3=(l,v)=>`<div class="prow"><span class="pl">${l}</span><div class="vec3">${
  AXES.map((a,i)=>`<div class="cell"><b class="${a[1]}">${a[0]}</b><input value="${v[i]}"></div>`).join('')}</div></div>`;
const rowSlider=(l,val,min,max,u)=>{
  const unit=(u||'').trim(), step=(max-min)<=20?0.1:1;
  return `<div class="prow"><span class="pl">${l}</span><div class="sldv"><span class="num">${val}</span>${unit?`<span class="unit">${unit}</span>`:''}</div><input type="range" class="sld" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
};
const rowSwitch=(l,on)=>`<div class="prow"><span class="pl">${l}</span><div class="sw ${on?'on':''}"></div><span style="flex:1"></span></div>`;
const rowSeg=(l,opts,on,cls)=>`<div class="prow"><span class="pl">${l}</span><div class="seg ${cls||''}">${
  opts.map(o=>`<button data-o="${o}" class="${o===on?'on':''}">${o}</button>`).join('')}</div></div>`;
const rowText=(l,v)=>`<div class="prow"><span class="pl">${l}</span><span style="font-size:12px;color:var(--text-dim)">${v}</span></div>`;
const rowInput=(l,v,id)=>`<div class="prow"><span class="pl">${l}</span><input class="txt" ${id?`id="${id}"`:''} value="${esc(v)}"></div>`;
const rowColour=n=>`<div class="prow"><span class="pl">Colour</span><div class="swatches" id="swWrap"></div></div>`;

/* channels — CPP accordion */
function chanEditor(n,id){
  const c=CH(id), st=n.chan[id];
  if(st.src==='Value'){
    if(c.kind==='colour')
      return `<div class="prow"><span class="pl">Colour</span><div class="colorbar"><span class="chip-round" style="background:${st.color}"></span><span class="cname">${st.color}</span><span class="caret">▾</span></div></div>`;
    return rowSlider('Value',st.val,0,c.id==='norm'?200:100,'%');
  }
  if(st.src==='Paint'){
    return `<div class="slot"><div class="slot-thumb" style="background:${c.hue}">${S(PATHS.brush,'#000',15)}</div>
      <div class="slot-text"><div class="slot-name">Painted by hand</div>
      <div class="slot-meta">148 strokes · 2048 × 2048 · ${c.name} atlas</div></div></div>`;
  }
  const g=GEN(st.gen);
  return `<div class="prow"><span class="pl">Generator</span><div class="pickbar" data-pick="${id}"><span class="pname">${g.label}</span><span class="caret">▾</span></div></div>`+
    `<div class="gen-params">${g.params.map(p=>rowSlider(p[0],p[1],0,100,'%')).join('')}</div>`;
}
function channelsCard(n){
  const chips=n.channels.map(id=>{
    const c=CH(id);
    return `<div class="chip"><span class="cswatch" style="background:${c.hue}"></span>${c.name}<button class="cx" data-rm="${id}">✕</button></div>`;
  }).join('')+`<button class="add-btn" id="addChan">＋</button>`;
  const panels=n.channels.map(id=>{
    const c=CH(id), st=n.chan[id], open=!!n.chOpen[id];
    return `<div class="chan-panel ${open?'':'collapsed'}" data-chp="${id}">
      <div class="chan-head" data-chh="${id}">
        <span class="ch-tw">${S(PATHS.chevd,null,10)}</span>
        <span class="ch-dot" style="background:${c.hue}"></span>
        <span class="ch-title">${c.name}</span>
        <span class="ch-src">${st.src}</span>
      </div>
      <div class="chan-shell"><div class="chan-clip"><div class="chan-body">
        ${rowSeg('Source',SOURCES,st.src,'chsrc" data-chs="'+id)}
        ${chanEditor(n,id)}
      </div></div></div>
    </div>`;
  }).join('');
  return card('Channels',`<div class="chips">${chips}</div>`+panels);
}
function wireChannels(n){
  propsEl.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{
    n.channels=n.channels.filter(id=>id!==b.dataset.rm); renderProps(); renderDetails();
  }));
  const add=document.getElementById('addChan');
  if(add) add.addEventListener('click',e=>{
    e.stopPropagation();
    const avail=CH_LIST.filter(c=>!n.channels.includes(c.id));
    let html='';
    CH_GROUPS.forEach(g=>{
      const items=avail.filter(c=>c.group===g);
      if(items.length) html+=`<div class="mh">${g}</div>`+items.map(c=>
        `<div class="mi" data-ch="${c.id}"><span class="swd" style="background:${c.hue}"></span>${c.name}<span class="note">${c.kind}</span></div>`).join('');
    });
    popMenu.innerHTML=`<div class="mh">Add Channel</div>`+(html||'<div class="mi dis">All channels active</div>');
    popMenu.querySelectorAll('[data-ch]').forEach(mi=>mi.addEventListener('click',()=>{
      const id=mi.dataset.ch;
      n.channels.push(id); n.chan[id]=chDefaults([id])[id]; n.chOpen[id]=true;
      closeMenus(); renderProps(); renderDetails();
    }));
    const r=add.getBoundingClientRect();
    place(popMenu,r.left,r.bottom+6);
  });
  propsEl.querySelectorAll('[data-chh]').forEach(h=>h.addEventListener('click',()=>{
    const id=h.dataset.chh;
    n.chOpen[id]=!n.chOpen[id];
    h.closest('.chan-panel').classList.toggle('collapsed',!n.chOpen[id]);
  }));
  propsEl.querySelectorAll('[data-chs]').forEach(seg=>{
    const id=seg.dataset.chs;
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      n.chan[id].src=b.dataset.o; n.chOpen[id]=true; renderProps();
    }));
  });
  propsEl.querySelectorAll('[data-pick]').forEach(pb=>pb.addEventListener('click',e=>{
    e.stopPropagation();
    const id=pb.dataset.pick;
    popMenu.innerHTML=GENS.map(g=>g.group
      ?`<div class="mh">${g.group}</div>`
      :`<div class="mi" data-g="${g.key}"><span class="swd" style="background:var(--hue-gen)"></span>${g.label}<span class="note">${g.note}</span></div>`).join('');
    popMenu.querySelectorAll('[data-g]').forEach(mi=>mi.addEventListener('click',()=>{
      n.chan[id].gen=mi.dataset.g; closeMenus(); renderProps();
    }));
    const r=pb.getBoundingClientRect();
    place(popMenu,r.left,r.bottom+6);
  }));
}

/* per-type property slides */
function placementCard(n){
  const mode=n.place==='UV'?'UV Space':'3D Placement';
  let body=rowSeg('Placement',['UV Space','3D Placement'],mode,'place');
  if(n.place==='UV'){
    body+=rowSeg('UV set',['UV0','UV1'],'UV0')+
      rowSlider('Tiling',1,1,16,'×')+
      rowSlider('Rotation',0,0,360,'°')+
      rowSeg('Wrap',['Repeat','Clamp','Mirror'],'Repeat');
  }else{
    body+=rowSeg('Projection',['Planar','Triplanar','Screen'],n.proj,'proj')+
      rowVec3('Position',['1.24','0.85','-0.40'])+
      rowVec3('Rotation',['0.0°','90.0°','0.0°'])+
      rowVec3('Scale',['1.00','1.00','1.00'])+
      rowSlider('Projection depth',8,1,50,' cm')+
      rowSwitch('Snap to surface',true);
  }
  return card('Decal Placement',body);
}
function cardsFor(n){
  if(n.type==='mask'){
    return card('Mask Properties',
        rowText('Masking',n.parent?n.parent.name:'—')+
        rowSeg('Source',['Paint','Generator','Texture'],n.src)+
        rowPick('Blend',n.blend,'mblend')+
        rowSlider('Density',n.density,0,100,'%')+
        rowSlider('Feather',n.feather,0,64,' px')+
        rowSwitch('Invert',n.invert))+
      card('Generator',
        rowSeg('Type',['Wear','Dirt','Noise'],'Wear')+
        rowSlider('Scale',40,1,100,'')+
        rowSlider('Contrast',65,0,100,'%')+
        rowSlider('Seed',7,0,99,''));
  }
  if(n.type==='folder'){
    return card('Folder',
      rowText('Items',String(n.kids.length))+
      rowPick('Blend mode',n.blend,'fblend')+
      rowSlider('Opacity',n.opacity,0,100,'%')+
      rowSwitch('Enabled',n.vis)+
      rowColour(n));
  }
  let html=card('Layer',
    rowText('Type',typeLabel(n))+
    rowPick('Blend mode',n.blend,'blend')+
    rowSlider('Opacity',n.opacity,0,100,'%')+
    rowPick('Resolution',n.res,'res')+
    rowSwitch('Enabled',n.vis)+
    rowColour(n));
  if(n.type==='fill'){
    html+=card('Fill Material',
      rowText('Material','M_Steel_Brushed')+
      rowSeg('Projection',['UV','Triplanar'],'Triplanar')+
      rowSlider('Tiling',4,1,32,'×')+
      rowSlider('Rotation',0,0,360,'°'));
  }else if(n.type==='decal'){
    if(n.decal==='text'){
      html+=card('Text Decal',
        rowInput('Text',n.text||'TEXT','decalText')+
        rowText('Font','Industry_Stencil')+
        rowSlider('Size',24,4,128,' cm'));
    }else if(n.decal==='pattern'){
      html+=card('Pattern Generator',
        rowSeg('Pattern',['Hex','Grid','Stripes'],'Hex')+
        rowSlider('Cell size',18,2,64,' cm')+
        rowSlider('Line width',3,1,16,' mm')+
        rowSlider('Bevel',20,0,100,'%')+
        rowSlider('Seed',3,0,99,''));
    }else{
      html+=card((n.decal==='svg'?'SVG':'Image')+' Decal',
        rowText('Source',n.decal==='svg'?'insignia_07.svg':'insignia_07.png')+
        rowSwitch('Keep aspect',true));
    }
    html+=placementCard(n);
  }
  html+=channelsCard(n);   /* every layer except masks & folders */
  return html;
}

/* colour swatches wiring (layer/folder tag colour) */
function wireColour(n){
  const sw=document.getElementById('swWrap');
  if(!sw) return;
  const paint=()=>{
    sw.innerHTML=COLORS.map(c=>`<div class="swatch ${n.color===c?'on':''}" data-c="${c}" style="background:${c}"></div>`).join('');
    sw.querySelectorAll('[data-c]').forEach(d=>d.addEventListener('click',()=>{
      n.color=d.dataset.c; paint(); renderTree(); renderDetails();
    }));
  };
  paint();
}

/* kit slider wiring */
function wireSlider(s){
  const num=s.closest('.prow').querySelector('.num');
  const min=+s.min, max=+s.max;
  const rest=s.closest('.chan-body')?'#2a2a2a':'var(--raised)';
  const paint=()=>{
    const p=((+s.value-min)/(max-min))*100;
    s.style.background=`linear-gradient(to right,#7a7a7a ${p}%,${rest} ${p}%)`;
    if(num) num.textContent=+s.value;
  };
  s.addEventListener('input',paint);
  paint();
}

const propsEl=document.getElementById('props');
function renderProps(){
  const n=current();
  if(!n){ propsEl.innerHTML=`<div class="empty">${S(PATHS.stack)}<span>Select a layer first</span></div>`; return; }
  propsEl.innerHTML=cardsFor(n);
  if(n.type!=='mask'&&n.type!=='folder') wireChannels(n);
  wireColour(n);
  wireDD(propsEl,n,()=>{renderProps();renderTree();renderDetails();});
  const dt=document.getElementById('decalText');
  if(dt) dt.addEventListener('input',()=>{ n.text=dt.value; });
  propsEl.querySelectorAll('.sld').forEach(wireSlider);
  propsEl.querySelectorAll('.sw').forEach(sw=>sw.addEventListener('click',()=>sw.classList.toggle('on')));
  propsEl.querySelectorAll('.seg.place button').forEach(b=>b.addEventListener('click',()=>{
    n.place=b.dataset.o==='UV Space'?'UV':'3D'; renderProps();
  }));
  propsEl.querySelectorAll('.seg.proj button').forEach(b=>b.addEventListener('click',()=>{ n.proj=b.dataset.o; }));
  propsEl.querySelectorAll('.seg:not(.chsrc):not(.place)').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  })));
}
