<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slate UI — Workspaces (dock · drag · resize panel windows)</title>

<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   SLATE UI — WORKSPACES
   Panel-window system: Chrome-style trapezoid tab strips
   (click switch · drag reorder live · drag away = tear out ·
   drop on another strip = merge) + window drag with edge
   docking + resizable edges. Panels: FOOTER only, NO header,
   interiors kept empty.
   ============================================================ */
:root{
  --bg:#050505;
  --panel:#121212;
  --inset:#1a1a1a;
  --field:#000000;
  --raised:#222222;

  --stroke:rgba(255,255,255,.05);
  --stroke-strong:#2e2e2e;

  --text:#f0f0f0;
  --text-dim:#888888;
  --text-faint:#5c5c5c;

  --accent:#ffffff;
  --hi:#6c77ff;
  --danger:#ef4444;

  --r-panel:18px;
  --r-pill:999px;

  --tabW:150px;          /* every tab UNIFORM */
  --tabOverlap:18px;     /* cascade /tab\tab\ — no spacing   */
  --tabSlant:16px;       /* wider base, constant slant       */

  --ease:cubic-bezier(.22,.61,.36,1);
  --shadow-panel:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.03);
  --shadow-pop:0 24px 60px rgba(0,0,0,.75);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:'General Sans','Segoe UI',Roboto,system-ui,Arial,sans-serif;
  font-size:14px;user-select:none;-webkit-font-smoothing:antialiased;
}
svg{display:block}

/* ── stage (left as-is: plain dark, faint dots) ── */
#stage{
  position:fixed;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:26px 26px;
}

/* ============================================================
   PANEL WINDOW — tab strip · empty interior · FOOTER (no header)
   ============================================================ */
.pwin{
  position:absolute;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r-panel);
  box-shadow:var(--shadow-panel);overflow:hidden;
  min-width:260px;min-height:170px;
}
.pwin.dragging{opacity:.94;cursor:grabbing}
.pwin.merge-glow{outline:1.5px dashed var(--hi);outline-offset:-1.5px}

/* ── trapezoid tab strip ── */
.tstrip{
  display:flex;align-items:flex-end;height:42px;flex-shrink:0;
  background:#0a0a0a;border-bottom:1px solid var(--stroke);
  padding:8px 12px 0;cursor:grab;
}
.tstrip:active{cursor:grabbing}
.ttab{
  position:relative;width:var(--tabW);height:34px;flex-shrink:0;
  border:none;background:transparent;cursor:pointer;
  margin-left:calc(var(--tabOverlap) * -1);
}
.ttab:first-child{margin-left:0}
.ttab::before{
  content:"";position:absolute;inset:0;
  background:#161616;
  clip-path:polygon(0 100%,var(--tabSlant) 0,calc(100% - var(--tabSlant)) 0,100% 100%);
  transition:background .15s var(--ease);
}
.ttab:hover::before{background:#1f1f1f}
.ttab.on::before{background:#000}
.ttab.ghosting{opacity:.4}
.tlabel{
  position:relative;z-index:2;height:100%;
  display:flex;align-items:center;justify-content:center;gap:7px;
  font:inherit;font-size:12px;font-weight:500;color:var(--text-dim);
  padding:0 24px;white-space:nowrap;overflow:hidden;pointer-events:none;
}
.tlabel svg{width:13px;height:13px;flex-shrink:0}
.ttab.on .tlabel{color:#fff;font-weight:600}
/* ✕ — rounded circle */
.ttab .tx{
  position:absolute;z-index:3;right:20px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.08);color:var(--text-dim);
  display:none;align-items:center;justify-content:center;font-size:9px;line-height:1;
}
.ttab:hover .tx{display:flex}
.ttab .tx:hover{background:var(--danger);color:#fff}
/* + — rounded circle */
.taddbtn{
  width:24px;height:24px;margin:0 0 5px 8px;border-radius:50%;flex-shrink:0;
  border:1px dashed var(--stroke-strong);background:transparent;color:var(--text-dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s var(--ease),color .15s var(--ease),background .15s var(--ease);
}
.taddbtn:hover{border-color:var(--accent);color:var(--text);background:rgba(255,255,255,.05)}
.taddbtn svg{width:12px;height:12px}

/* ── EMPTY interior ── */
.pbody{flex:1;min-height:0;position:relative}
.pbody .empty{
  position:absolute;inset:10px;border:1px dashed rgba(255,255,255,.05);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-faint);font-size:11.5px;letter-spacing:.4px;pointer-events:none;
}

/* ── FOOTER (panels have footers, no headers) ── */
.pfoot{
  height:30px;display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0;
  border-top:1px solid var(--stroke);background:rgba(255,255,255,.02);
  font-size:10.5px;color:var(--text-faint);
}
.pfoot b{color:var(--text-dim);font-weight:600}
.pfoot .spacer{flex:1}
.pfoot .grip{display:flex;gap:3px;align-items:center}
.pfoot .grip i{width:3px;height:3px;border-radius:50%;background:var(--stroke-strong)}

/* ── resize handles ── */
.rz{position:absolute;z-index:6}
.rz.e{right:-3px;top:14px;bottom:14px;width:8px;cursor:ew-resize}
.rz.w{left:-3px;top:14px;bottom:14px;width:8px;cursor:ew-resize}
.rz.s{bottom:-3px;left:14px;right:14px;height:8px;cursor:ns-resize}
.rz.n{top:-3px;left:14px;right:14px;height:8px;cursor:ns-resize}
.rz.se{right:-3px;bottom:-3px;width:16px;height:16px;cursor:nwse-resize}

/* ── dock zone highlight ── */
#dockzone{
  position:absolute;display:none;z-index:400;pointer-events:none;
  background:rgba(108,119,255,.10);border:1.5px dashed var(--hi);border-radius:16px;
}

/* ── add window fab ── */
#fab{
  position:fixed;right:26px;bottom:26px;z-index:500;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--stroke-strong);
  background:var(--panel);color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-pop);
  transition:color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease);
}
#fab:hover{color:var(--text);border-color:var(--accent)}
#fab:active{transform:scale(.92)}
#fab svg{width:18px;height:18px}

#hint{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;
  font-size:10.5px;color:var(--text-faint);letter-spacing:.3px;white-space:nowrap;pointer-events:none;
}
</style>
</head>
<body>

<div id="stage">
  <div id="dockzone"></div>
</div>
<button id="fab" title="New window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="hint">drag tabs to reorder · pull a tab out to tear off · drop a strip onto another strip to merge · drag near an edge to dock</div>

<script>
/* ============================================================
   ICONS
   ============================================================ */
const IC={
  outliner:'<path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z"/><path d="m4 12.5 8 4.5 8-4.5"/>',
  props:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  viewport:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>',
  console:'<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
  assets:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  timeline:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  material:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18"/>',
  history:'<path d="M3 12a9 9 0 1 0 2.6-6.4M3 3v6h6"/>',
  panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',
};
const svg=(n)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]||IC.panel}</svg>`;

/* ============================================================
   STATE
   ============================================================ */
let TID=0,WID=0,ZI=10;
const T=(title,icon)=>({id:++TID,title,icon:icon||'panel'});
const W=(x,y,w,h,tabs,extra)=>Object.assign({id:++WID,x,y,w,h,tabs,active:0,z:++ZI,dock:null},extra||{});

const vw=()=>innerWidth, vh=()=>innerHeight;
const wins=[
  W(14,14,340,vh()-28,[T('Outliner','outliner'),T('Properties','props')],{dock:'left'}),
  W(400,60,Math.min(720,vw()-820),440,[T('Viewport','viewport'),T('Material','material'),T('History','history')]),
  W(400,530,760,240,[T('Console','console'),T('Timeline','timeline'),T('Assets','assets')]),
];

const stage=document.getElementById('stage');
const dockzone=document.getElementById('dockzone');

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  stage.querySelectorAll('.pwin').forEach(el=>el.remove());
  wins.forEach(win=>stage.appendChild(buildWin(win)));
}
function buildWin(win){
  const el=document.createElement('div');
  el.className='pwin';
  el.dataset.wid=win.id;
  el.style.cssText=`left:${win.x}px;top:${win.y}px;width:${win.w}px;height:${win.h}px;z-index:${win.z}`;

  /* strip */
  const strip=document.createElement('div');
  strip.className='tstrip';
  win.tabs.forEach((tab,i)=>{
    const t=document.createElement('button');
    t.className='ttab'+(i===win.active?' on':'');
    t.style.zIndex=i===win.active?70:60-i;
    t.dataset.idx=i;
    t.innerHTML=`<span class="tlabel">${svg(tab.icon)}${tab.title}</span><span class="tx" title="Close">✕</span>`;
    t.querySelector('.tx').addEventListener('pointerdown',e=>e.stopPropagation());
    t.querySelector('.tx').addEventListener('click',e=>{
      e.stopPropagation();
      win.tabs.splice(i,1);
      if(!win.tabs.length){wins.splice(wins.indexOf(win),1);}
      else win.active=Math.min(win.active,win.tabs.length-1);
      render();
    });
    t.addEventListener('pointerdown',e=>tabPress(e,win,i));
    strip.appendChild(t);
  });
  const add=document.createElement('button');
  add.className='taddbtn';add.title='Add panel';
  add.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  add.addEventListener('pointerdown',e=>e.stopPropagation());
  add.addEventListener('click',e=>{
    e.stopPropagation();
    win.tabs.push(T('Panel_'+(TID+1)));
    win.active=win.tabs.length-1;
    render();
  });
  strip.appendChild(add);
  strip.addEventListener('pointerdown',e=>{
    if(e.target.closest('.ttab,.taddbtn'))return;
    winPress(e,win);
  });
  el.appendChild(strip);

  /* EMPTY interior */
  const body=document.createElement('div');
  body.className='pbody';
  const tab=win.tabs[win.active];
  body.innerHTML=`<div class="empty">${tab?tab.title+' — empty panel':''}</div>`;
  el.appendChild(body);

  /* FOOTER */
  const foot=document.createElement('div');
  foot.className='pfoot';
  foot.innerHTML=`<span><b>${win.tabs.length}</b> panel${win.tabs.length===1?'':'s'}</span>
    <span>${tab?('· <b>'+tab.title+'</b> active'):''}</span>
    <span class="spacer"></span>
    <span>${win.dock?('docked '+win.dock):Math.round(win.w)+' × '+Math.round(win.h)}</span>
    <span class="grip"><i></i><i></i><i></i></span>`;
  el.appendChild(foot);

  /* resize handles */
  ['e','w','s','n','se'].forEach(dir=>{
    const h=document.createElement('div');
    h.className='rz '+dir;
    h.addEventListener('pointerdown',e=>rzPress(e,win,dir));
    el.appendChild(h);
  });

  el.addEventListener('pointerdown',()=>{win.z=++ZI;el.style.zIndex=win.z;});
  return el;
}

/* ============================================================
   ONE GLOBAL GESTURE CONTROLLER
   modes: tab (press→reorder→tear) · win (drag+dock) · rz
   ============================================================ */
let gest=null;
const PITCH=150-18;   /* effective tab pitch with overlap */

function tabPress(e,win,idx){
  e.preventDefault();
  gest={mode:'tab',win,idx,sx:e.clientX,sy:e.clientY,moved:false};
}
function winPress(e,win){
  e.preventDefault();
  gest={mode:'win',win,dx:e.clientX-win.x,dy:e.clientY-win.y,sx:e.clientX,sy:e.clientY,moved:false};
}
function rzPress(e,win,dir){
  e.preventDefault();e.stopPropagation();
  gest={mode:'rz',win,dir,sx:e.clientX,sy:e.clientY,ox:win.x,oy:win.y,ow:win.w,oh:win.h};
}

addEventListener('pointermove',e=>{
  if(!gest)return;
  const dx=e.clientX-gest.sx, dy=e.clientY-gest.sy;

  /* ── TAB: live reorder, tear out past the strip ── */
  if(gest.mode==='tab'){
    if(!gest.moved&&Math.hypot(dx,dy)>4)gest.moved=true;
    if(!gest.moved)return;
    const win=gest.win;
    if(Math.abs(dy)>30){
      /* tear out → becomes a window drag */
      let tearWin;
      if(win.tabs.length===1){
        tearWin=win;win.dock=null;
      }else{
        const tab=win.tabs.splice(gest.idx,1)[0];
        win.active=Math.min(win.active===gest.idx?0:(win.active>gest.idx?win.active-1:win.active),win.tabs.length-1);
        tearWin=W(e.clientX-190,e.clientY-20,420,300,[tab]);
        wins.push(tearWin);
      }
      tearWin.x=e.clientX-190;tearWin.y=e.clientY-20;tearWin.z=++ZI;
      gest={mode:'win',win:tearWin,dx:190,dy:20,sx:e.clientX,sy:e.clientY,moved:true};
      render();
      return;
    }
    /* live reorder within the strip */
    const el=stage.querySelector(`.pwin[data-wid="${win.id}"] .tstrip`);
    if(!el)return;
    const r=el.getBoundingClientRect();
    let target=Math.floor((e.clientX-r.left-12)/PITCH);
    target=Math.max(0,Math.min(win.tabs.length-1,target));
    if(target!==gest.idx){
      const [tab]=win.tabs.splice(gest.idx,1);
      win.tabs.splice(target,0,tab);
      if(win.active===gest.idx)win.active=target;
      else if(gest.idx<win.active&&target>=win.active)win.active--;
      else if(gest.idx>win.active&&target<=win.active)win.active++;
      gest.idx=target;
      render();
    }
    return;
  }

  /* ── WINDOW: drag · strip merge glow · edge dock zones ── */
  if(gest.mode==='win'){
    if(!gest.moved&&Math.hypot(dx,dy)>3)gest.moved=true;
    const win=gest.win;
    win.dock=null;
    win.x=e.clientX-gest.dx;
    win.y=Math.max(0,e.clientY-gest.dy);
    const el=stage.querySelector(`.pwin[data-wid="${win.id}"]`);
    if(el){el.style.left=win.x+'px';el.style.top=win.y+'px';el.classList.add('dragging');}

    /* strip merge target */
    let merge=null;
    stage.querySelectorAll('.pwin').forEach(o=>{
      o.classList.remove('merge-glow');
      if(+o.dataset.wid===win.id)return;
      const sr=o.querySelector('.tstrip').getBoundingClientRect();
      if(e.clientX>=sr.left&&e.clientX<=sr.right&&e.clientY>=sr.top-6&&e.clientY<=sr.bottom+6)merge=o;
    });
    if(merge){merge.classList.add('merge-glow');dockzone.style.display='none';gest.merge=+merge.dataset.wid;gest.zone=null;return;}
    gest.merge=null;

    /* dock zones */
    const Z=70;
    let zone=null;
    if(e.clientX<Z)zone={side:'left',x:12,y:12,w:340,h:vh()-24};
    else if(e.clientX>vw()-Z)zone={side:'right',x:vw()-352,y:12,w:340,h:vh()-24};
    else if(e.clientY>vh()-Z)zone={side:'bottom',x:12,y:vh()-252,w:vw()-24,h:240};
    gest.zone=zone;
    if(zone){
      dockzone.style.display='block';
      dockzone.style.cssText+=`;left:${zone.x}px;top:${zone.y}px;width:${zone.w}px;height:${zone.h}px`;
    }else dockzone.style.display='none';
    return;
  }

  /* ── RESIZE ── */
  if(gest.mode==='rz'){
    const w=gest.win,d=gest.dir;
    if(d.includes('e'))w.w=Math.max(260,gest.ow+dx);
    if(d.includes('s'))w.h=Math.max(170,gest.oh+dy);
    if(d==='w'){w.w=Math.max(260,gest.ow-dx);w.x=gest.ox+(gest.ow-w.w);}
    if(d==='n'){w.h=Math.max(170,gest.oh-dy);w.y=gest.oy+(gest.oh-w.h);}
    const el=stage.querySelector(`.pwin[data-wid="${w.id}"]`);
    if(el)el.style.cssText=`left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px;z-index:${w.z}`;
  }
});

addEventListener('pointerup',e=>{
  if(!gest)return;
  const g=gest;gest=null;
  dockzone.style.display='none';
  stage.querySelectorAll('.merge-glow').forEach(o=>o.classList.remove('merge-glow'));

  if(g.mode==='tab'){
    if(!g.moved){g.win.active=g.idx;render();}
    else render();
    return;
  }
  if(g.mode==='win'){
    const win=g.win;
    /* merge into another strip */
    if(g.merge){
      const tgt=wins.find(w=>w.id===g.merge);
      if(tgt){
        const el=stage.querySelector(`.pwin[data-wid="${tgt.id}"] .tstrip`);
        const r=el.getBoundingClientRect();
        let at=Math.max(0,Math.min(tgt.tabs.length,Math.round((e.clientX-r.left-12)/PITCH)));
        tgt.tabs.splice(at,0,...win.tabs);
        tgt.active=at;
        tgt.z=++ZI;
        wins.splice(wins.indexOf(win),1);
      }
      render();return;
    }
    /* dock */
    if(g.zone){
      const occupied=wins.find(w=>w!==win&&w.dock===g.zone.side);
      if(occupied)occupied.dock=null;                 /* swap out the old tenant */
      win.dock=g.zone.side;
      win.x=g.zone.x;win.y=g.zone.y;win.w=g.zone.w;win.h=g.zone.h;
    }
    render();return;
  }
  if(g.mode==='rz')render();
});

/* new window fab */
document.getElementById('fab').addEventListener('click',()=>{
  wins.push(W(vw()/2-210+(wins.length%5)*24,vh()/2-150+(wins.length%5)*24,420,300,[T('Panel_'+(TID+1))]));
  render();
});

addEventListener('resize',()=>{
  wins.forEach(w=>{
    if(w.dock==='left'){w.h=vh()-24;}
    if(w.dock==='right'){w.x=vw()-352;w.h=vh()-24;}
    if(w.dock==='bottom'){w.y=vh()-252;w.w=vw()-24;}
    w.x=Math.min(w.x,vw()-60);w.y=Math.min(w.y,vh()-60);
  });
  render();
});

render();
</script>
</body>
</html>
