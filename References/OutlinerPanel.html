<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate — Outliner Panel</title>
<style>
  /* ══════════════════════════════════════════════════════════════════
     OUTLINER PANEL (V1) — one card: [ scene tree | details carousel ]
     Shares the UIComponents.html design language:
     OLED black desk, #121212 panel, black pill fields, white accent.
     ══════════════════════════════════════════════════════════════════ */
  :root{
    --bg:#050505; --panel:#121212; --inset:#1a1a1a; --field:#000;
    --raised:#222; --selected:#2a2a2a;
    --text:#f0f0f0; --text-dim:#888; --text-faint:#5c5c5c;
    --accent:#fff; --hi:#6c77ff; --danger:#ef4444;
    --ax-x:#ef5350; --ax-y:#69d06d; --ax-z:#5b8cff;
    --warn:#ef4444; --caution:#f59e0b; --info:#3b82f6; --success:#22c55e;
    --r-panel:24px; --r-inset:18px; --r-pill:999px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; user-select:none;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:28px; overflow:hidden;}

  /* ── card shell ─────────────────────────────────────────────────── */
  .card{
    width:min(1060px,96vw); height:min(680px,92vh);
    background:var(--panel); border-radius:var(--r-panel);
    box-shadow:0 24px 70px rgba(0,0,0,.65);
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* header + footer — full card width, identical lengths */
  .card-head,.card-foot{
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:0 22px; background:var(--panel);
  }
  .card-head{height:58px; border-bottom:1px solid rgba(255,255,255,.06);}
  .card-foot{height:44px; border-top:1px solid rgba(255,255,255,.06); color:var(--text-faint); font-size:11.5px;}
  .card-head .h-icon{width:26px;height:26px;display:grid;place-items:center;}
  .card-head .h-title{font-size:14px;font-weight:600;letter-spacing:.4px;}
  .card-head .h-sub{font-size:11px;color:var(--text-faint);margin-left:2px;}
  .card-head .spacer,.card-foot .spacer{flex:1;}
  .iconbtn{
    width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;
    background:var(--raised);color:var(--text-dim);display:grid;place-items:center;
    transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);
  }
  .iconbtn:hover{background:#2e2e2e;color:var(--text);transform:scale(1.08);}
  .iconbtn:active{transform:scale(.94);}

  .body{flex:1; display:flex; min-height:0;}

  /* ── left: tree pane ────────────────────────────────────────────── */
  .tree-pane{
    flex:0 0 46%; min-width:340px; display:flex; flex-direction:column;
    border-right:1px solid rgba(255,255,255,.06); padding:16px 0 12px;
  }
  .sec-label{font-size:10px;letter-spacing:1.6px;color:var(--text-faint);text-transform:uppercase;padding:0 20px 8px;}

  /* filter row */
  .filter-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 20px 14px;}
  .addfilter{
    height:30px;padding:0 14px;border:none;border-radius:var(--r-pill);cursor:pointer;
    background:var(--field);color:var(--text-dim);font-size:12px;display:flex;align-items:center;gap:8px;
    transition:color .18s var(--ease),background .18s var(--ease);
  }
  .addfilter:hover{color:var(--text);background:#0d0d0d;}
  .pill{
    height:28px;padding:0 6px 0 12px;border-radius:var(--r-pill);
    background:#fff;color:#000;font-size:11.5px;font-weight:600;
    display:flex;align-items:center;gap:6px;
    animation:pillIn .22s var(--ease);
  }
  @keyframes pillIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  .pill .px{
    width:18px;height:18px;border-radius:50%;border:none;cursor:pointer;
    background:transparent;color:#000;font-size:11px;line-height:1;display:grid;place-items:center;
    transition:background .15s var(--ease),color .15s var(--ease);
  }
  .pill .px:hover{background:var(--danger);color:#fff;}

  .divider{height:1px;background:rgba(255,255,255,.07);margin:0 20px 10px;}

  /* tree — scrollable, scrollbar hidden */
  .tree{flex:1;overflow-y:auto;padding:0 12px 8px;scrollbar-width:none;}
  .tree::-webkit-scrollbar{display:none;}
  .node{}
  .row{
    display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;cursor:pointer;
    border-radius:0;                       /* rectangular selection, always */
    transition:background .14s var(--ease);
    position:relative;
  }
  .row:hover{background:#1c1c1c;}
  .row.sel{background:var(--selected);box-shadow:inset 2px 0 0 var(--accent);}
  .row .tw{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;color:var(--text-faint);
    transition:transform .18s var(--ease);cursor:pointer;}
  .row .tw.open{transform:rotate(90deg);}
  .row .tw.leaf{visibility:hidden;}
  .row .ni{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;}
  .row .nm{font-size:12.5px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .nm input{
    width:100%;background:var(--field);border:1px solid var(--hi);color:var(--text);
    font-size:12.5px;padding:2px 6px;outline:none;border-radius:0;
  }
  .row .badge{width:14px;height:14px;flex:0 0 14px;display:grid;place-items:center;}
  .row .vis{width:22px;height:22px;flex:0 0 22px;border:none;background:transparent;color:var(--text-faint);
    cursor:pointer;display:grid;place-items:center;border-radius:50%;transition:color .15s var(--ease);}
  .row .vis:hover{color:var(--text);}
  .row .vis.off{color:#3a3a3a;}
  .kids{overflow:hidden;transition:height .22s var(--ease);}
  .kids .row{/* indentation applied inline */}

  /* ── right: details pane w/ internal carousel ───────────────────── */
  .det-pane{flex:1;display:flex;flex-direction:column;min-width:0;padding:16px 0 12px;}
  .det-top{display:flex;align-items:center;gap:10px;padding:0 20px 12px;}
  .det-title{font-size:12.5px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .det-type{font-size:10.5px;color:var(--text-faint);letter-spacing:.6px;text-transform:uppercase;}
  .pager{display:flex;align-items:center;gap:8px;}
  .dots{display:flex;gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#333;transition:background .2s var(--ease),transform .2s var(--ease);}
  .dot.on{background:var(--accent);transform:scale(1.25);}

  .car-viewport{flex:1;overflow:hidden;position:relative;}
  .car-track{display:flex;height:100%;transition:transform .32s var(--ease);}
  .slide{flex:0 0 100%;height:100%;overflow-y:auto;scrollbar-width:none;padding:2px 20px 14px;}
  .slide::-webkit-scrollbar{display:none;}

  /* category cards inside slides */
  .pcard{
    background:var(--inset);border-radius:var(--r-inset);padding:14px 16px 16px;margin-bottom:12px;
    animation:cardIn .28s var(--ease);
  }
  @keyframes cardIn{from{transform:translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
  .pcard h4{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-faint);margin-bottom:12px;}
  .prow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .prow:last-child{margin-bottom:0;}
  .prow .pl{flex:0 0 86px;font-size:11.5px;color:var(--text-dim);}

  /* vec3 → rounded pills */
  .vec3{display:flex;gap:6px;flex:1;}
  .cell{
    flex:1;height:28px;border-radius:var(--r-pill);background:var(--field);
    display:flex;align-items:center;gap:6px;padding:0 10px;
  }
  .cell b{font-size:9.5px;font-weight:700;}
  .cell b.ax-x{color:var(--ax-x);} .cell b.ax-y{color:var(--ax-y);} .cell b.ax-z{color:var(--ax-z);}
  .cell input{flex:1;width:100%;min-width:0;background:transparent;border:none;color:var(--text);font-size:11.5px;outline:none;text-align:right;}

  /* flat slider */
  .sld{flex:1;display:flex;align-items:center;gap:10px;}
  .sld .track{flex:1;height:20px;position:relative;cursor:pointer;touch-action:none;}
  .sld .track::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;
    transform:translateY(-50%);border-radius:2px;background:#2c2c2c;}
  .sld .fill{position:absolute;left:0;top:50%;height:4px;transform:translateY(-50%);
    border-radius:2px;background:var(--accent);pointer-events:none;}
  .sld .knob{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);
    transform:translate(-50%,-50%);pointer-events:none;transition:transform .15s var(--ease);}
  .sld .track:hover .knob,.sld.drag .knob{transform:translate(-50%,-50%) scale(1.3);}
  .sld .val{flex:0 0 44px;text-align:right;font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;}

  /* switch */
  .sw{width:36px;height:20px;border-radius:var(--r-pill);background:#2c2c2c;position:relative;cursor:pointer;
    transition:background .2s var(--ease);flex:0 0 36px;}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#777;
    transition:left .2s var(--ease),background .2s var(--ease);}
  .sw.on{background:var(--accent);}
  .sw.on::after{left:19px;background:#000;}

  /* colour chip */
  .chip{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.12);cursor:pointer;}

  /* notes */
  .notes{
    width:100%;min-height:88px;resize:vertical;background:var(--field);border:none;border-radius:12px;
    color:var(--text);font-size:12px;line-height:1.5;padding:10px 12px;outline:none;user-select:text;
  }
  .notes::placeholder{color:var(--text-faint);}

  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-faint);font-size:12px;}

  /* ── popups: fixed, flip-aware ──────────────────────────────────── */
  .menu{
    position:fixed;z-index:900;min-width:190px;background:var(--panel);border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.7);padding:6px;display:none;
    transform-origin:top left;animation:menuIn .16s var(--ease);
  }
  @keyframes menuIn{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .menu.show{display:block;}
  .menu .mh{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-faint);padding:8px 12px 6px;}
  .menu .mi{
    display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;
    font-size:12px;color:var(--text);transition:background .14s var(--ease);
  }
  .menu .mi:hover{background:var(--raised);}
  .menu .mi.dis{color:var(--text-faint);pointer-events:none;}
  .menu .msep{height:1px;background:rgba(255,255,255,.07);margin:5px 8px;}
  svg{display:block;}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="card-head">
    <span class="h-icon" id="hIcon"></span>
    <span class="h-title">Outliner</span>
    <span class="h-sub">Scene · Demo_Level</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnAdd" title="Add object">＋</button>
    <button class="iconbtn" title="Panel options">⋯</button>
  </div>

  <div class="body">
    <!-- LEFT : tree -->
    <div class="tree-pane">
      <div class="sec-label">Filter</div>
      <div class="filter-row" id="filterRow">
        <button class="addfilter" id="btnFilter">＋ &nbsp;Add filter</button>
      </div>
      <div class="divider"></div>
      <div class="sec-label">Scene Hierarchy</div>
      <div class="tree" id="tree"></div>
    </div>

    <!-- RIGHT : details carousel -->
    <div class="det-pane">
      <div class="det-top">
        <span class="det-title" id="detTitle">No selection</span>
        <span class="det-type" id="detType"></span>
        <div class="pager">
          <button class="iconbtn" id="pgPrev" title="Previous">‹</button>
          <div class="dots" id="dots"></div>
          <button class="iconbtn" id="pgNext" title="Next">›</button>
        </div>
      </div>
      <div class="car-viewport">
        <div class="car-track" id="track"></div>
      </div>
    </div>
  </div>

  <div class="card-foot">
    <span id="footInfo">— </span>
    <span class="spacer"></span>
    <span id="footSel">0 selected</span>
  </div>
</div>

<!-- popups -->
<div class="menu" id="filterMenu"></div>
<div class="menu" id="ctxMenu"></div>

<script>
(()=>{ "use strict";
/* ── svg icon factory ─────────────────────────────────────────────── */
const S=(p,c)=>`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${c||'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={
  folder :c=>S('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',c||'#c9a24b'),
  layer  :c=>S('<path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/>',c||'#7f8cff'),
  mesh   :c=>S('<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12"/><path d="m3 7 9 5 9-5"/>',c||'#9aa0a6'),
  light  :c=>S('<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9 4.9 19.1"/>',c||'#f5d34b'),
  camera :c=>S('<rect x="2" y="6" width="13" height="12" rx="2"/><path d="m15 10 7-4v12l-7-4z"/>',c||'#69c3ff'),
  sky    :c=>S('<path d="M4 16a5 5 0 1 1 3-9 6 6 0 1 1 5 9z"/>',c||'#8fd3ff'),
  sun    :c=>S('<circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>',c||'#ffb14b'),
  warn   :c=>S('<path d="m12 3 10 18H2z"/><path d="M12 10v4M12 17.5v.5"/>',c),
  eye    :()=>S('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'),
  eyeoff :()=>S('<path d="M2 12s3.5-7 10-7c2 0 3.8.7 5.3 1.6M22 12s-3.5 7-10 7c-2 0-3.8-.7-5.3-1.6"/><path d="m3 3 18 18"/>'),
  chev   :()=>S('<path d="m9 6 6 6-6 6"/>'),
  cube   :()=>S('<path d="M12 2 3 7v10l9 5 9-5V7z"/>'),
};
document.getElementById('hIcon').innerHTML=S('<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>','#fff');

/* ── scene model ──────────────────────────────────────────────────── */
let UID=0;
const N=(name,type,kids,extra)=>({id:++UID,name,type,kids:kids||[],open:true,vis:true,warn:null,notes:'',...(extra||{})});
const scene=[
  N('Environment','folder',[
    N('Sky Atmosphere','sky',[],{warn:null}),
    N('Sun','sun'),
    N('Fog Volume','layer',[],{warn:'caution'}),
  ]),
  N('Geometry','folder',[
    N('Layer_Buildings','layer',[
      N('Tower_A','mesh'),
      N('Tower_B','mesh',[],{warn:'warn'}),
      N('Bridge_Deck','mesh'),
    ]),
    N('Layer_Terrain','layer',[
      N('Terrain_Patch_00','mesh'),
      N('Terrain_Patch_01','mesh'),
    ]),
  ]),
  N('Lighting','folder',[
    N('Key_Light','light'),
    N('Rim_Light','light',[],{warn:'caution'}),
    N('Bounce_Fill','light'),
  ]),
  N('Cameras','folder',[
    N('Cam_Main','camera'),
    N('Cam_Flyover','camera'),
  ]),
];
const TYPE_LABEL={folder:'Folder',layer:'Layer',mesh:'Mesh',light:'Light',camera:'Camera',sky:'Sky',sun:'Sun'};
const WARN_COL={warn:'var(--warn)',caution:'var(--caution)'};

/* flat walk */
const flat=[]; const walk=(list,depth,parent)=>list.forEach(n=>{n.depth=depth;n.parent=parent;flat.push(n);walk(n.kids,depth+1,n);});
const reflat=()=>{flat.length=0;walk(scene,0,null);};

/* ── state ────────────────────────────────────────────────────────── */
const sel=new Set(); let lastSel=null; const filters=new Set();

/* ── tree render ──────────────────────────────────────────────────── */
const treeEl=document.getElementById('tree');
function passFilter(n){
  if(!filters.size) return true;
  if(filters.has(TYPE_LABEL[n.type])) return true;
  return n.kids.some(passFilter);
}
function renderTree(){
  reflat(); treeEl.innerHTML='';
  const build=(list,host)=>{
    list.forEach(n=>{
      if(!passFilter(n)) return;
      const nd=document.createElement('div'); nd.className='node';
      const row=document.createElement('div'); row.className='row'+(sel.has(n.id)?' sel':'');
      row.style.paddingLeft=(8+n.depth*18)+'px';
      const leaf=!n.kids.length;
      row.innerHTML=
        `<span class="tw ${leaf?'leaf':''} ${n.open?'open':''}">${IC.chev()}</span>`+
        `<span class="ni">${(IC[n.type]||IC.cube)()}</span>`+
        `<span class="nm" data-nm>${n.name}</span>`+
        (n.warn?`<span class="badge" title="${n.warn==='warn'?'Warning':'Caution'}">${IC.warn(n.warn==='warn'?'#ef4444':'#f59e0b')}</span>`:'')+
        `<button class="vis ${n.vis?'':'off'}" title="Toggle visibility">${n.vis?IC.eye():IC.eyeoff()}</button>`;
      /* twirl */
      const tw=row.querySelector('.tw');
      if(!leaf) tw.addEventListener('click',e=>{e.stopPropagation();n.open=!n.open;renderTree();});
      /* visibility */
      row.querySelector('.vis').addEventListener('click',e=>{e.stopPropagation();n.vis=!n.vis;renderTree();});
      /* select (multi w/ ctrl, range w/ shift) */
      row.addEventListener('click',e=>{
        if(e.ctrlKey||e.metaKey){ sel.has(n.id)?sel.delete(n.id):sel.add(n.id); }
        else if(e.shiftKey&&lastSel!=null){
          const vis=flat.filter(passFilter);
          const a=vis.findIndex(x=>x.id===lastSel), b=vis.findIndex(x=>x.id===n.id);
          if(a>-1&&b>-1){ sel.clear(); vis.slice(Math.min(a,b),Math.max(a,b)+1).forEach(x=>sel.add(x.id)); }
        }else{ sel.clear(); sel.add(n.id); }
        lastSel=n.id; renderTree(); renderDetails();
      });
      /* rename */
      row.querySelector('[data-nm]').addEventListener('dblclick',e=>{
        e.stopPropagation();
        const nm=e.currentTarget;
        nm.innerHTML=`<input value="${n.name.replace(/"/g,'&quot;')}">`;
        const inp=nm.querySelector('input'); inp.focus(); inp.select();
        const done=ok=>{ if(ok&&inp.value.trim()) n.name=inp.value.trim(); renderTree(); renderDetails(); };
        inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter')done(true); if(ev.key==='Escape')done(false); });
        inp.addEventListener('blur',()=>done(true));
      });
      /* context menu */
      row.addEventListener('contextmenu',e=>{
        e.preventDefault();
        if(!sel.has(n.id)){ sel.clear(); sel.add(n.id); lastSel=n.id; renderTree(); renderDetails(); }
        openCtx(e.clientX,e.clientY,n);
      });
      nd.appendChild(row);
      if(!leaf){
        const kd=document.createElement('div'); kd.className='kids';
        if(!n.open) kd.style.display='none';
        build(n.kids,kd); nd.appendChild(kd);
      }
      host.appendChild(nd);
    });
  };
  build(scene,treeEl);
  updateFoot();
}
function updateFoot(){
  document.getElementById('footInfo').textContent=`${flat.length} objects · ${filters.size?[...filters].join(', '):'no filters'}`;
  document.getElementById('footSel').textContent=`${sel.size} selected`;
}

/* ── popup helper: fixed + flip-up + clamp ────────────────────────── */
function place(menu,x,y){
  menu.classList.add('show');
  const r=menu.getBoundingClientRect();
  let px=x, py=y;
  if(py+r.height>innerHeight-10) py=Math.max(10,y-r.height);
  if(px+r.width>innerWidth-10)  px=innerWidth-10-r.width;
  menu.style.left=px+'px'; menu.style.top=py+'px';
}
const filterMenu=document.getElementById('filterMenu');
const ctxMenu=document.getElementById('ctxMenu');
function closeMenus(){filterMenu.classList.remove('show');ctxMenu.classList.remove('show');}
addEventListener('pointerdown',e=>{ if(!e.target.closest('.menu')) closeMenus(); });
addEventListener('blur',closeMenus);

/* filter dropdown */
document.getElementById('btnFilter').addEventListener('click',e=>{
  e.stopPropagation();
  const types=['Folder','Layer','Mesh','Light','Camera','Sky','Sun'].filter(t=>!filters.has(t));
  filterMenu.innerHTML=`<div class="mh">Add Filter</div>`+
    (types.length?types.map(t=>`<div class="mi" data-t="${t}">${(IC[t.toLowerCase()]||IC.cube)()} ${t}</div>`).join('')
                 :'<div class="mi dis">All filters active</div>');
  filterMenu.querySelectorAll('[data-t]').forEach(mi=>mi.addEventListener('click',()=>{
    filters.add(mi.dataset.t); closeMenus(); renderFilters(); renderTree();
  }));
  const r=e.currentTarget.getBoundingClientRect();
  place(filterMenu,r.left,r.bottom+6);
});
function renderFilters(){
  const row=document.getElementById('filterRow');
  row.querySelectorAll('.pill').forEach(p=>p.remove());
  filters.forEach(t=>{
    const p=document.createElement('div'); p.className='pill';
    p.innerHTML=`${t}<button class="px" title="Remove">✕</button>`;
    p.querySelector('.px').addEventListener('click',()=>{filters.delete(t);renderFilters();renderTree();});
    row.appendChild(p);
  });
}

/* context menu */
function openCtx(x,y,n){
  ctxMenu.innerHTML=
    `<div class="mh">${n.name}</div>`+
    `<div class="mi" data-a="rename">Rename</div>`+
    `<div class="mi" data-a="dup">Duplicate</div>`+
    `<div class="mi" data-a="vis">${n.vis?'Hide':'Show'}</div>`+
    `<div class="msep"></div>`+
    `<div class="mi" data-a="del" style="color:var(--danger)">Delete</div>`;
  ctxMenu.querySelectorAll('.mi').forEach(mi=>mi.addEventListener('click',()=>{
    const a=mi.dataset.a; closeMenus();
    if(a==='vis'){ n.vis=!n.vis; }
    if(a==='dup'){ const c=N(n.name+'_Copy',n.type); (n.parent?n.parent.kids:scene).push(c); }
    if(a==='del'){ const arr=n.parent?n.parent.kids:scene; const i=arr.indexOf(n); if(i>-1)arr.splice(i,1); sel.delete(n.id); }
    if(a==='rename'){ renderTree(); const rows=[...treeEl.querySelectorAll('.row.sel [data-nm]')]; if(rows[0]) rows[0].dispatchEvent(new Event('dblclick',{bubbles:false})); return; }
    renderTree(); renderDetails();
  }));
  place(ctxMenu,x,y);
}

/* ── details carousel ─────────────────────────────────────────────── */
const track=document.getElementById('track'), dotsEl=document.getElementById('dots');
let page=0, pageCount=1;
function goto(i){
  page=Math.max(0,Math.min(pageCount-1,i));
  track.style.transform=`translateX(-${page*100}%)`;
  [...dotsEl.children].forEach((d,k)=>d.classList.toggle('on',k===page));
}
document.getElementById('pgPrev').addEventListener('click',()=>goto(page-1));
document.getElementById('pgNext').addEventListener('click',()=>goto(page+1));

/* widget builders */
const esc=s=>String(s).replace(/"/g,'&quot;');
function rowVec3(label,vals){
  return `<div class="prow"><span class="pl">${label}</span><div class="vec3">${
    [['X','ax-x'],['Y','ax-y'],['Z','ax-z']].map((a,i)=>`<div class="cell"><b class="${a[1]}">${a[0]}</b><input value="${vals[i]}"></div>`).join('')
  }</div></div>`;
}
function rowSlider(label,val,min,max,unit){
  return `<div class="prow"><span class="pl">${label}</span><div class="sld" data-min="${min}" data-max="${max}" data-val="${val}" data-unit="${unit||''}">
    <div class="track"><div class="fill"></div><div class="knob"></div></div><span class="val"></span></div></div>`;
}
function wireSlider(s){
  const tr=s.querySelector('.track'), fill=s.querySelector('.fill'), knob=s.querySelector('.knob'), val=s.querySelector('.val');
  const min=+s.dataset.min, max=+s.dataset.max, unit=s.dataset.unit||'';
  const dec=(max-min)<=20?1:0;
  let v=+s.dataset.val;
  const paint=()=>{
    const p=(v-min)/(max-min);
    fill.style.width=(p*100)+'%'; knob.style.left=(p*100)+'%';
    val.textContent=v.toFixed(dec)+unit;
  };
  const fromX=x=>{
    const r=tr.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(x-r.left)/r.width));
    v=+(min+p*(max-min)).toFixed(dec); s.dataset.val=v; paint();
  };
  tr.addEventListener('pointerdown',e=>{ e.preventDefault(); tr.setPointerCapture(e.pointerId); s.classList.add('drag'); fromX(e.clientX); });
  tr.addEventListener('pointermove',e=>{ if(s.classList.contains('drag')) fromX(e.clientX); });
  const end=()=>s.classList.remove('drag');
  tr.addEventListener('pointerup',end);
  tr.addEventListener('pointercancel',end);
  paint();
}

function rowSwitch(label,on){
  return `<div class="prow"><span class="pl">${label}</span><div class="sw ${on?'on':''}"></div><span style="flex:1"></span></div>`;
}
function rowChip(label,col,text){
  return `<div class="prow"><span class="pl">${label}</span><div class="chip" style="background:${col}"></div><span style="font-size:11px;color:var(--text-dim)">${text||col}</span></div>`;
}
function card(title,inner){ return `<div class="pcard"><h4>${title}</h4>${inner}</div>`; }

/* slide builders per node type */
function slidesFor(n){
  const slides=[];
  /* — slide 1: item + transform — */
  let s1=card('Item',
      `<div class="prow"><span class="pl">Name</span><span style="font-size:12px">${esc(n.name)}</span></div>`+
      `<div class="prow"><span class="pl">Type</span><span style="font-size:12px;color:var(--text-dim)">${TYPE_LABEL[n.type]}</span></div>`+
      rowSwitch('Visible',n.vis)+
      (n.warn?rowChip('Status',n.warn==='warn'?'#ef4444':'#f59e0b',n.warn==='warn'?'Warning — needs attention':'Caution — check setup'):''));
  if(n.type!=='folder'){
    s1+=card('Transform',
      rowVec3('Translation',['0.00','0.00','0.00'])+
      rowVec3('Rotation',['0.0°','0.0°','0.0°'])+
      rowVec3('Scale',['1.00','1.00','1.00']));
  }
  slides.push(s1);
  /* — slide 2: type-specific — */
  if(n.type==='light'){
    slides.push(
      card('Light Properties',
        rowChip('Colour','#fff3d8','Warm white')+
        rowSlider('Intensity',80,0,200,' lm')+
        rowSlider('Radius',12,0,50,' m')+
        rowSlider('Softness',35,0,100,'%')+
        rowSwitch('Cast shadows',true)+
        rowSwitch('Volumetric',false))+
      card('Shadow',
        rowSlider('Bias',2,0,10,'')+
        rowSlider('Resolution',2048,256,4096,' px')));
  }else if(n.type==='sun'){
    slides.push(
      card('Sun',
        rowSlider('Azimuth',134,0,360,'°')+
        rowSlider('Elevation',42,0,90,'°')+
        rowSlider('Intensity',110,0,200,' klx')+
        rowChip('Tint','#ffdca8','Golden hour')+
        rowSwitch('Cast shadows',true))+
      card('Atmosphere Coupling',
        rowSwitch('Drive sky colour',true)+
        rowSlider('Haze boost',18,0,100,'%')));
  }else if(n.type==='sky'){
    slides.push(
      card('Sky Atmosphere',
        rowSlider('Turbidity',3,1,10,'')+
        rowSlider('Ozone',40,0,100,'%')+
        rowSlider('Ground albedo',22,0,100,'%')+
        rowChip('Zenith','#2b57ff','Deep blue')+
        rowChip('Horizon','#bcd6ff','Pale blue'))+
      card('Clouds',
        rowSwitch('Enabled',true)+
        rowSlider('Coverage',45,0,100,'%')+
        rowSlider('Density',60,0,100,'%')));
  }else if(n.type==='mesh'){
    slides.push(
      card('Mesh',
        `<div class="prow"><span class="pl">Triangles</span><span style="font-size:12px;color:var(--text-dim)">18 402</span></div>`+
        `<div class="prow"><span class="pl">Material</span><span style="font-size:12px;color:var(--text-dim)">M_Concrete_A</span></div>`+
        rowSwitch('Cast shadows',true)+
        rowSwitch('Two-sided',false))+
      card('LOD',
        rowSlider('Screen size',35,0,100,'%')+
        rowSlider('LOD bias',0,-2,2,'')));
  }else if(n.type==='camera'){
    slides.push(
      card('Camera',
        rowSlider('Focal length',35,12,200,' mm')+
        rowSlider('Aperture',28,10,220,'')+
        rowSlider('Focus dist',85,1,500,' m')+
        rowSwitch('Depth of field',true)));
  }else if(n.type==='layer'){
    slides.push(
      card('Layer',
        `<div class="prow"><span class="pl">Children</span><span style="font-size:12px;color:var(--text-dim)">${n.kids.length}</span></div>`+
        rowSwitch('Locked',false)+
        rowSwitch('Selectable',true)+
        rowChip('Colour tag','#7f8cff','Layer accent')));
  }
  /* — last slide: notes — */
  slides.push(card('Notes',
    `<textarea class="notes" id="notesField" placeholder="Write notes about ${esc(n.name)}…">${esc(n.notes)}</textarea>`));
  return slides;
}

function renderDetails(){
  const t=document.getElementById('detTitle'), ty=document.getElementById('detType');
  track.innerHTML=''; dotsEl.innerHTML='';
  const ids=[...sel];
  if(!ids.length){
    t.textContent='No selection'; ty.textContent='';
    track.innerHTML=`<div class="slide"><div class="empty">${IC.cube()}<span>Select an object to inspect it</span></div></div>`;
    pageCount=1; dotsEl.innerHTML='<div class="dot on"></div>'; goto(0); return;
  }
  if(ids.length>1){
    t.textContent=`${ids.length} objects`; ty.textContent='Multi';
    track.innerHTML=`<div class="slide">${card('Multi-selection',
      `<div class="prow"><span class="pl">Count</span><span style="font-size:12px">${ids.length}</span></div>`+
      rowSwitch('Visible (all)',true))}</div>`;
    pageCount=1; dotsEl.innerHTML='<div class="dot on"></div>'; goto(0); wire(); return;
  }
  const n=flat.find(x=>x.id===ids[0]); if(!n) return;
  t.textContent=n.name; ty.textContent=TYPE_LABEL[n.type];
  const slides=slidesFor(n);
  pageCount=slides.length;
  track.innerHTML=slides.map(s=>`<div class="slide">${s}</div>`).join('');
  dotsEl.innerHTML=slides.map((_,i)=>`<div class="dot ${i===0?'on':''}"></div>`).join('');
  goto(0); wire();
  const nf=document.getElementById('notesField');
  if(nf) nf.addEventListener('input',()=>{ n.notes=nf.value; });
}

/* wire sliders + switches inside current slides */
function wire(){
  track.querySelectorAll('.sld').forEach(wireSlider);
  track.querySelectorAll('.sw').forEach(sw=>sw.addEventListener('click',()=>sw.classList.toggle('on')));
}

/* add-object menu */
document.getElementById('btnAdd').addEventListener('click',e=>{
  e.stopPropagation();
  filterMenu.innerHTML=`<div class="mh">Add to Scene</div>`+
    ['Folder','Layer','Mesh','Light','Camera'].map(t=>`<div class="mi" data-t="${t}">${(IC[t.toLowerCase()]||IC.cube)()} ${t}</div>`).join('');
  filterMenu.querySelectorAll('[data-t]').forEach(mi=>mi.addEventListener('click',()=>{
    const t=mi.dataset.t; closeMenus();
    scene.push(N('New_'+t,t.toLowerCase())); renderTree();
  }));
  const r=e.currentTarget.getBoundingClientRect();
  place(filterMenu,r.right-190,r.bottom+6);
});

/* boot */
renderTree(); renderDetails();
})();
</script>
