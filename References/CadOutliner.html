<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate — CAD Outliner</title>
<style>
  /* ══════════════════════════════════════════════════════════════════
     CAD OUTLINER — feature tree for a part, OutlinerV2 pattern:
     whole-card slide to per-feature Properties, nav in header only.
     Proper folder structure: Reference / Sketches / Curves / Polygons /
     Solids / Booleans — boolean operations carry their operands as
     child nodes. Each feature type gets its own CAD property cards.
     ══════════════════════════════════════════════════════════════════ */
  :root{
    --bg:#050505; --panel:#121212; --inset:#1a1a1a; --field:#000;
    --raised:#222; --selected:#2a2a2a;
    --text:#f0f0f0; --text-dim:#888; --text-faint:#5c5c5c;
    --accent:#fff; --hi:#6c77ff; --danger:#ef4444;
    --warn:#ef4444; --caution:#f59e0b;
    --hue-sketch:#3b82f6; --hue-curve:#10b981; --hue-poly:#f59e0b;
    --hue-solid:#8b5cf6; --hue-bool:#ef7b45; --hue-ref:#6a6a6a;
    --r-panel:24px; --r-inset:18px; --r-pill:999px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; user-select:none;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:28px; overflow:hidden;}

  .card{
    width:min(560px,96vw); height:min(720px,92vh);
    background:var(--panel); border-radius:var(--r-panel);
    box-shadow:0 24px 70px rgba(0,0,0,.65);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .card-head,.card-foot{flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:0 20px;}
  .card-head{height:56px; border-bottom:1px solid rgba(255,255,255,.06);}
  .card-foot{height:42px; border-top:1px solid rgba(255,255,255,.06); color:var(--text-faint); font-size:11.5px;}
  .h-title{font-size:14px;font-weight:600;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .h-sub{font-size:11px;color:var(--text-faint);}
  .spacer{flex:1;}
  .iconbtn{
    width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;
    background:var(--raised);color:var(--text-dim);display:grid;place-items:center;
    transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);
  }
  .iconbtn:hover{background:#2e2e2e;color:var(--text);transform:scale(1.08);}
  .iconbtn:active{transform:scale(.94);}
  .iconbtn.props{background:var(--accent);color:#000;}
  .iconbtn.props:hover{background:#e6e6e6;}
  .iconbtn:disabled{opacity:.35;pointer-events:none;}

  .view-wrap{flex:1;overflow:hidden;min-height:0;}
  .view-track{display:flex;width:200%;height:100%;transition:transform .34s var(--ease);}
  .view{flex:0 0 50%;height:100%;display:flex;flex-direction:column;min-width:0;}

  .sec-label{font-size:10px;letter-spacing:1.6px;color:var(--text-faint);text-transform:uppercase;padding:14px 20px 8px;}
  .divider{height:1px;background:rgba(255,255,255,.07);margin:0 20px 8px;}

  /* filter */
  .filter-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 20px 14px;}
  .addfilter{
    height:30px;padding:0 14px;border:none;border-radius:var(--r-pill);cursor:pointer;
    background:var(--field);color:var(--text-dim);font-size:12px;display:flex;align-items:center;gap:8px;
    transition:color .18s var(--ease),background .18s var(--ease);
  }
  .addfilter:hover{color:var(--text);background:#0d0d0d;}
  .pill{
    height:28px;padding:0 6px 0 12px;border-radius:var(--r-pill);
    background:#fff;color:#000;font-size:11.5px;font-weight:600;
    display:flex;align-items:center;gap:6px;animation:pillIn .22s var(--ease);
  }
  @keyframes pillIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  .pill .px{width:18px;height:18px;border-radius:50%;border:none;cursor:pointer;background:transparent;color:#000;
    font-size:11px;display:grid;place-items:center;transition:background .15s var(--ease),color .15s var(--ease);}
  .pill .px:hover{background:var(--danger);color:#fff;}

  /* tree */
  .tree{flex:1;overflow-y:auto;padding:0 12px 10px;scrollbar-width:none;}
  .tree::-webkit-scrollbar{display:none;}
  .row{
    display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;cursor:pointer;
    border-radius:0;transition:background .14s var(--ease);
  }
  .row:hover{background:#1c1c1c;}
  .row.sel{background:var(--selected);box-shadow:inset 2px 0 0 var(--accent);}
  .row .tw{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;color:var(--text-faint);
    transition:transform .18s var(--ease);cursor:pointer;}
  .row .tw.open{transform:rotate(90deg);}
  .row .tw.leaf{visibility:hidden;}
  .row .ni{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;}
  .row .nm{font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .nm input{width:100%;background:var(--field);border:1px solid var(--hi);color:var(--text);
    font-size:12.5px;padding:2px 6px;outline:none;border-radius:0;}
  .row .tag{font-size:9.5px;color:var(--text-faint);letter-spacing:.6px;text-transform:uppercase;
    background:var(--field);border-radius:var(--r-pill);padding:3px 8px;}
  .row .badge{width:14px;height:14px;flex:0 0 14px;display:grid;place-items:center;}
  .row .vis{width:22px;height:22px;flex:0 0 22px;border:none;background:transparent;color:var(--text-faint);
    cursor:pointer;display:grid;place-items:center;transition:color .15s var(--ease);}
  .row .vis:hover{color:var(--text);}
  .row .vis.off{color:#3a3a3a;}

  /* properties */
  .props-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:14px 20px 16px;}
  .props-scroll::-webkit-scrollbar{display:none;}
  .pcard{background:var(--inset);border-radius:var(--r-inset);padding:14px 16px 16px;margin-bottom:12px;
    animation:cardIn .28s var(--ease);}
  @keyframes cardIn{from{transform:translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
  .pcard h4{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-faint);margin-bottom:12px;}
  .prow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .prow:last-child{margin-bottom:0;}
  .prow .pl{flex:0 0 96px;font-size:11.5px;color:var(--text-dim);}
  .vec3{display:flex;gap:6px;flex:1;}
  .cell{flex:1;height:28px;border-radius:var(--r-pill);background:var(--field);
    display:flex;align-items:center;gap:6px;padding:0 10px;}
  .cell b{font-size:9.5px;color:var(--text-faint);font-weight:700;}
  .cell input{flex:1;width:100%;min-width:0;background:transparent;border:none;color:var(--text);font-size:11.5px;outline:none;text-align:right;}
  .sld{flex:1;display:flex;align-items:center;gap:10px;}
  .sld .track{flex:1;height:4px;border-radius:2px;background:#2c2c2c;position:relative;cursor:pointer;}
  .sld .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent);}
  .sld .knob{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);
    transform:translate(-50%,-50%);transition:transform .15s var(--ease);}
  .sld .track:hover .knob{transform:translate(-50%,-50%) scale(1.25);}
  .sld .val{flex:0 0 52px;text-align:right;font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .sw{width:36px;height:20px;border-radius:var(--r-pill);background:#2c2c2c;position:relative;cursor:pointer;
    transition:background .2s var(--ease);flex:0 0 36px;}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#777;
    transition:left .2s var(--ease),background .2s var(--ease);}
  .sw.on{background:var(--accent);}
  .sw.on::after{left:19px;background:#000;}
  .seg{display:flex;background:var(--field);border-radius:var(--r-pill);padding:3px;flex:1;}
  .seg button{flex:1;height:24px;border:none;border-radius:var(--r-pill);background:transparent;color:var(--text-dim);
    font-size:10.5px;cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease);}
  .seg button.on{background:var(--accent);color:#000;font-weight:600;}
  .oprow{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:12px;
    padding:8px 12px;margin-bottom:8px;}
  .oprow:last-child{margin-bottom:0;}
  .oprow .on{flex:1;font-size:12px;}
  .oprow .ot{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);
    background:var(--inset);border-radius:var(--r-pill);padding:3px 8px;}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--text-faint);font-size:12px;}

  /* popups */
  .menu{position:fixed;z-index:900;min-width:200px;background:var(--panel);border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.7);padding:6px;display:none;animation:menuIn .16s var(--ease);}
  @keyframes menuIn{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .menu.show{display:block;}
  .menu .mh{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-faint);padding:8px 12px 6px;}
  .menu .mi{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;
    font-size:12px;transition:background .14s var(--ease);}
  .menu .mi:hover{background:var(--raised);}
  .menu .mi.dis{color:var(--text-faint);pointer-events:none;}
  .menu .msep{height:1px;background:rgba(255,255,255,.07);margin:5px 8px;}
  svg{display:block;}
</style>
</head>
<body>

<div class="card">
  <div class="card-head">
    <button class="iconbtn" id="btnBack" title="Back to feature tree" style="display:none">‹</button>
    <span class="h-title" id="hTitle">CAD Outliner</span>
    <span class="h-sub" id="hSub">Part · Part_Bracket</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnAdd" title="Add feature">＋</button>
    <button class="iconbtn props" id="btnProps" title="Open properties" disabled>›</button>
  </div>

  <div class="view-wrap">
    <div class="view-track" id="viewTrack">
      <!-- view 0 : feature tree -->
      <div class="view">
        <div class="sec-label">Filter</div>
        <div class="filter-row" id="filterRow">
          <button class="addfilter" id="btnFilter">＋ &nbsp;Add filter</button>
        </div>
        <div class="divider"></div>
        <div class="sec-label">Feature Tree</div>
        <div class="tree" id="tree"></div>
      </div>
      <!-- view 1 : per-feature properties -->
      <div class="view">
        <div class="props-scroll" id="props"></div>
      </div>
    </div>
  </div>

  <div class="card-foot">
    <span id="footInfo">—</span>
    <span class="spacer"></span>
    <span id="footSel">0 selected</span>
  </div>
</div>

<div class="menu" id="popMenu"></div>
<div class="menu" id="ctxMenu"></div>

<script>
(()=>{ "use strict";
const S=(p,c)=>`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${c||'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={
  part   :c=>S('<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12L3 7M12 12l9-5"/>',c||'#e8e8e8'),
  folder :c=>S('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',c||'#c9a24b'),
  origin :c=>S('<circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>',c||'var(--hue-ref)'),
  plane  :c=>S('<path d="M3 17 9 5h12l-6 12z"/>',c||'var(--hue-ref)'),
  axis   :c=>S('<path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/>',c||'var(--hue-ref)'),
  sketch :c=>S('<path d="M4 20 20 4M4 20h6M4 20v-6"/><circle cx="20" cy="4" r="2"/>',c||'var(--hue-sketch)'),
  curve  :c=>S('<path d="M3 20c8 0 4-16 12-16 3 0 6 3 6 3"/>',c||'var(--hue-curve)'),
  helix  :c=>S('<path d="M6 4c8 0 12 2 12 4s-4 4-12 4 12 2 12 4-4 4-12 4"/>',c||'var(--hue-curve)'),
  spline :c=>S('<path d="M3 17c5-10 13 8 18-6"/><circle cx="3" cy="17" r="1.6"/><circle cx="21" cy="11" r="1.6"/>',c||'var(--hue-curve)'),
  polygon:c=>S('<path d="M12 3 20 8.5v7L12 21l-8-5.5v-7z"/>',c||'var(--hue-poly)'),
  extrude:c=>S('<rect x="5" y="12" width="14" height="8"/><path d="M12 9V3M9 6l3-3 3 3"/>',c||'var(--hue-solid)'),
  revolve:c=>S('<path d="M12 3v18"/><path d="M12 7c5 0 8 1.5 8 3.5S17 14 12 14"/><path d="m17 12 3 2-4 1"/>',c||'var(--hue-solid)'),
  sweep  :c=>S('<circle cx="5" cy="18" r="2.5"/><path d="M7 16C12 12 14 9 19 5"/><circle cx="19" cy="5" r="1.4"/>',c||'var(--hue-solid)'),
  fillet :c=>S('<path d="M20 20H8a4 4 0 0 1-4-4V4"/><path d="M4 12a8 8 0 0 0 8 8"/>',c||'var(--hue-solid)'),
  bool   :c=>S('<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>',c||'var(--hue-bool)'),
  operand:c=>S('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',c||'#7a7a7a'),
  warn   :c=>S('<path d="m12 3 10 18H2z"/><path d="M12 10v4M12 17.5v.5"/>',c),
  eye    :()=>S('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'),
  eyeoff :()=>S('<path d="M2 12s3.5-7 10-7c2 0 3.8.7 5.3 1.6M22 12s-3.5 7-10 7c-2 0-3.8-.7-5.3-1.6"/><path d="m3 3 18 18"/>'),
  chev   :()=>S('<path d="m9 6 6 6-6 6"/>'),
};

/* ── model — proper folder structure ─────────────────────────────── */
let UID=0;
const N=(name,type,kids,extra)=>({id:++UID,name,type,kids:kids||[],open:true,vis:true,warn:null,tag:null,...(extra||{})});
const scene=[
  N('Part_Bracket','part',[
    N('Reference','folder',[
      N('Origin','origin'), N('Plane_XY','plane'), N('Plane_XZ','plane'), N('Plane_YZ','plane'), N('Axis_Z','axis'),
    ],{open:false}),
    N('Sketches','folder',[
      N('Sketch_BasePlate','sketch'),
      N('Sketch_BossProfile','sketch'),
      N('Sketch_HolePattern','sketch',[],{warn:'caution'}),
    ]),
    N('Curves','folder',[
      N('Curve_FilletPath','curve'), N('Helix_Thread','helix'), N('Spline_Guide','spline'),
    ]),
    N('Polygons','folder',[
      N('Poly_HexBoss','polygon'), N('Poly_MountFace','polygon'),
    ]),
    N('Solids','folder',[
      N('Extrude_Base','extrude'), N('Revolve_Boss','revolve'), N('Sweep_Rib','sweep'),
      N('Fillet_Edges','fillet',[],{warn:'warn'}),
    ]),
    N('Booleans','folder',[
      N('Bool_Union_Boss','bool',[
        N('Extrude_Base','operand',[],{tag:'target'}),
        N('Revolve_Boss','operand',[],{tag:'tool'}),
      ],{op:'Union'}),
      N('Bool_Subtract_Holes','bool',[
        N('Union_Result','operand',[],{tag:'target'}),
        N('Pattern_Holes','operand',[],{tag:'tool'}),
      ],{op:'Subtract'}),
    ]),
  ]),
];
const TYPE_LABEL={part:'Part',folder:'Folder',origin:'Origin',plane:'Plane',axis:'Axis',sketch:'Sketch',
  curve:'Curve',helix:'Helix',spline:'Spline',polygon:'Polygon',extrude:'Extrude',revolve:'Revolve',
  sweep:'Sweep',fillet:'Fillet',bool:'Boolean',operand:'Operand'};
const FILTER_MAP={Sketches:['sketch'],Curves:['curve','helix','spline'],Polygons:['polygon'],
  Solids:['extrude','revolve','sweep','fillet'],Booleans:['bool','operand'],Reference:['origin','plane','axis']};

const flat=[]; const walk=(l,d,p)=>l.forEach(n=>{n.depth=d;n.parent=p;flat.push(n);walk(n.kids,d+1,n);});
const reflat=()=>{flat.length=0;walk(scene,0,null);};

let selId=null; let view=0; const filters=new Set();
const current=()=>flat.find(x=>x.id===selId)||null;

/* ── whole-card slide (header-only nav) ───────────────────────────── */
const viewTrack=document.getElementById('viewTrack');
const btnProps=document.getElementById('btnProps'), btnBack=document.getElementById('btnBack'), btnAdd=document.getElementById('btnAdd');
const hTitle=document.getElementById('hTitle'), hSub=document.getElementById('hSub');
function viewTo(i){
  view=i;
  viewTrack.style.transform=`translateX(-${i*50}%)`;
  const n=current();
  if(i===1&&n){
    hTitle.textContent=n.name; hSub.textContent=TYPE_LABEL[n.type]+' Feature';
    btnBack.style.display=''; btnProps.style.display='none'; btnAdd.style.display='none';
  }else{
    hTitle.textContent='CAD Outliner'; hSub.textContent='Part · Part_Bracket';
    btnBack.style.display='none'; btnProps.style.display=''; btnAdd.style.display='';
  }
}
btnProps.addEventListener('click',()=>{ if(current()){ renderProps(); viewTo(1); } });
btnBack.addEventListener('click',()=>viewTo(0));

/* ── tree ─────────────────────────────────────────────────────────── */
const treeEl=document.getElementById('tree');
function passFilter(n){
  if(!filters.size) return true;
  const types=[...filters].flatMap(f=>FILTER_MAP[f]||[]);
  if(types.includes(n.type)||n.type==='part') return true;
  return n.kids.some(passFilter);
}
function renderTree(){
  reflat(); treeEl.innerHTML='';
  const build=(list,host)=>{
    list.forEach(n=>{
      if(!passFilter(n)) return;
      const row=document.createElement('div');
      row.className='row'+(n.id===selId?' sel':'');
      row.style.paddingLeft=(8+n.depth*18)+'px';
      const leaf=!n.kids.length;
      row.innerHTML=
        `<span class="tw ${leaf?'leaf':''} ${n.open?'open':''}">${IC.chev()}</span>`+
        `<span class="ni">${(IC[n.type]||IC.part)()}</span>`+
        `<span class="nm" data-nm>${n.name}</span>`+
        (n.tag?`<span class="tag">${n.tag}</span>`:'')+
        (n.op?`<span class="tag">${n.op}</span>`:'')+
        (n.warn?`<span class="badge">${IC.warn(n.warn==='warn'?'#ef4444':'#f59e0b')}</span>`:'')+
        (n.type!=='operand'?`<button class="vis ${n.vis?'':'off'}">${n.vis?IC.eye():IC.eyeoff()}</button>`:'');
      const tw=row.querySelector('.tw');
      if(!leaf) tw.addEventListener('click',e=>{e.stopPropagation();n.open=!n.open;renderTree();});
      const vb=row.querySelector('.vis');
      if(vb) vb.addEventListener('click',e=>{e.stopPropagation();n.vis=!n.vis;renderTree();});
      row.addEventListener('click',()=>{ selId=n.id; renderTree(); });
      row.addEventListener('dblclick',e=>{
        if(e.target.closest('.tw,.vis')||n.type==='operand') return;
        const nm=row.querySelector('[data-nm]');
        nm.innerHTML=`<input value="${n.name.replace(/"/g,'&quot;')}">`;
        const inp=nm.querySelector('input'); inp.focus(); inp.select();
        const done=ok=>{ if(ok&&inp.value.trim()) n.name=inp.value.trim(); renderTree(); };
        inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter')done(true); if(ev.key==='Escape')done(false); });
        inp.addEventListener('blur',()=>done(true));
      });
      row.addEventListener('contextmenu',e=>{
        e.preventDefault(); selId=n.id; renderTree(); openCtx(e.clientX,e.clientY,n);
      });
      host.appendChild(row);
      if(!leaf&&n.open) build(n.kids,host);
    });
  };
  build(scene,treeEl);
  const feats=flat.filter(n=>!['part','folder','operand'].includes(n.type)).length;
  document.getElementById('footInfo').textContent=`${feats} features · ${filters.size?[...filters].join(', '):'no filters'}`;
  document.getElementById('footSel').textContent=current()?current().name:'0 selected';
  btnProps.disabled=!current();
}

/* ── popups ───────────────────────────────────────────────────────── */
const popMenu=document.getElementById('popMenu'), ctxMenu=document.getElementById('ctxMenu');
function place(menu,x,y){
  menu.classList.add('show');
  const r=menu.getBoundingClientRect();
  let px=x, py=y;
  if(py+r.height>innerHeight-10) py=Math.max(10,y-r.height);
  if(px+r.width>innerWidth-10)  px=innerWidth-10-r.width;
  menu.style.left=px+'px'; menu.style.top=py+'px';
}
function closeMenus(){popMenu.classList.remove('show');ctxMenu.classList.remove('show');}
addEventListener('pointerdown',e=>{ if(!e.target.closest('.menu')) closeMenus(); });
addEventListener('blur',closeMenus);

document.getElementById('btnFilter').addEventListener('click',e=>{
  e.stopPropagation();
  const opts=Object.keys(FILTER_MAP).filter(f=>!filters.has(f));
  popMenu.innerHTML=`<div class="mh">Add Filter</div>`+
    (opts.length?opts.map(f=>`<div class="mi" data-f="${f}">${(IC[FILTER_MAP[f][0]]||IC.part)()} ${f}</div>`).join('')
                :'<div class="mi dis">All filters active</div>');
  popMenu.querySelectorAll('[data-f]').forEach(mi=>mi.addEventListener('click',()=>{
    filters.add(mi.dataset.f); closeMenus(); renderFilters(); renderTree();
  }));
  const r=e.currentTarget.getBoundingClientRect();
  place(popMenu,r.left,r.bottom+6);
});
function renderFilters(){
  const row=document.getElementById('filterRow');
  row.querySelectorAll('.pill').forEach(p=>p.remove());
  filters.forEach(f=>{
    const p=document.createElement('div'); p.className='pill';
    p.innerHTML=`${f}<button class="px">✕</button>`;
    p.querySelector('.px').addEventListener('click',()=>{filters.delete(f);renderFilters();renderTree();});
    row.appendChild(p);
  });
}
const FOLDER_OF={sketch:'Sketches',curve:'Curves',helix:'Curves',spline:'Curves',polygon:'Polygons',
  extrude:'Solids',revolve:'Solids',sweep:'Solids',fillet:'Solids',bool:'Booleans'};
btnAdd.addEventListener('click',e=>{
  e.stopPropagation();
  popMenu.innerHTML=
    `<div class="mh">Sketch & Curves</div>`+
    `<div class="mi" data-t="sketch">${IC.sketch()} Sketch</div>`+
    `<div class="mi" data-t="spline">${IC.spline()} Spline</div>`+
    `<div class="mi" data-t="helix">${IC.helix()} Helix</div>`+
    `<div class="mi" data-t="polygon">${IC.polygon()} Polygon</div>`+
    `<div class="msep"></div><div class="mh">Solids & Booleans</div>`+
    `<div class="mi" data-t="extrude">${IC.extrude()} Extrude</div>`+
    `<div class="mi" data-t="revolve">${IC.revolve()} Revolve</div>`+
    `<div class="mi" data-t="sweep">${IC.sweep()} Sweep</div>`+
    `<div class="mi" data-t="fillet">${IC.fillet()} Fillet</div>`+
    `<div class="mi" data-t="bool">${IC.bool()} Boolean</div>`;
  popMenu.querySelectorAll('[data-t]').forEach(mi=>mi.addEventListener('click',()=>{
    const t=mi.dataset.t; closeMenus();
    const folder=scene[0].kids.find(k=>k.name===FOLDER_OF[t]);
    const nn=N('New_'+TYPE_LABEL[t],t,[],t==='bool'?{op:'Union'}:{});
    (folder?folder.kids:scene[0].kids).push(nn);
    if(folder) folder.open=true;
    selId=nn.id; renderTree();
  }));
  const r=e.currentTarget.getBoundingClientRect();
  place(popMenu,r.right-200,r.bottom+6);
});
function openCtx(x,y,n){
  const isOp=n.type==='operand', isStruct=n.type==='part'||n.type==='folder';
  ctxMenu.innerHTML=
    `<div class="mh">${n.name}</div>`+
    `<div class="mi" data-a="props">Properties…</div>`+
    (!isStruct&&!isOp?`<div class="mi" data-a="dup">Duplicate</div>`:'')+
    (!isOp?`<div class="mi" data-a="vis">${n.vis?'Suppress':'Unsuppress'}</div>`:'')+
    (!isStruct&&!isOp?`<div class="msep"></div><div class="mi" data-a="del" style="color:var(--danger)">Delete feature</div>`:'');
  ctxMenu.querySelectorAll('.mi').forEach(mi=>mi.addEventListener('click',()=>{
    const a=mi.dataset.a; closeMenus();
    if(a==='props'){ renderProps(); viewTo(1); return; }
    if(a==='vis'){ n.vis=!n.vis; }
    if(a==='dup'){ (n.parent?n.parent.kids:scene).push(N(n.name+'_Copy',n.type,[],{op:n.op})); }
    if(a==='del'){ const arr=n.parent?n.parent.kids:scene; const i=arr.indexOf(n); if(i>-1)arr.splice(i,1);
      if(selId===n.id){ selId=null; if(view===1)viewTo(0); } }
    renderTree();
  }));
  place(ctxMenu,x,y);
}

/* ── per-feature CAD property cards ───────────────────────────────── */
const card=(t,i)=>`<div class="pcard"><h4>${t}</h4>${i}</div>`;
const rowVec3=(l,v)=>`<div class="prow"><span class="pl">${l}</span><div class="vec3">${
  ['X','Y','Z'].map((a,i)=>`<div class="cell"><b>${a}</b><input value="${v[i]}"></div>`).join('')}</div></div>`;
const rowSlider=(l,val,min,max,u)=>{
  const pct=((val-min)/(max-min))*100;
  return `<div class="prow"><span class="pl">${l}</span><div class="sld" data-min="${min}" data-max="${max}" data-unit="${u||''}">
    <div class="track"><div class="fill" style="width:${pct}%"></div><div class="knob" style="left:${pct}%"></div></div>
    <span class="val">${val}${u||''}</span></div></div>`;
};
const rowSwitch=(l,on)=>`<div class="prow"><span class="pl">${l}</span><div class="sw ${on?'on':''}"></div><span style="flex:1"></span></div>`;
const rowSeg=(l,opts,on)=>`<div class="prow"><span class="pl">${l}</span><div class="seg">${
  opts.map(o=>`<button class="${o===on?'on':''}">${o}</button>`).join('')}</div></div>`;
const rowText=(l,v)=>`<div class="prow"><span class="pl">${l}</span><span style="font-size:12px;color:var(--text-dim)">${v}</span></div>`;

function cardsFor(n){
  let html=card('Feature',
    rowText('Name',n.name)+rowText('Type',TYPE_LABEL[n.type])+
    (n.type!=='operand'?rowSwitch('Active',n.vis):rowText('Role',n.tag||'—'))+
    (n.warn?rowText('Status',n.warn==='warn'?'⚠ Failed to rebuild':'⚠ Under-constrained'):''));
  switch(n.type){
    case 'part':
      html+=card('Part',
        rowText('Material','Aluminium 6061-T6')+rowText('Units','millimetres')+
        rowText('Mass','182.4 g')+rowText('Volume','67 555 mm³')+rowSwitch('Auto rebuild',true));
      break;
    case 'sketch':
      html+=card('Sketch',
        rowText('Plane','Plane_XY')+rowText('Entities','24')+rowText('Constraints','31')+
        rowSwitch('Fully defined',n.warn!=='caution')+rowSwitch('Show dimensions',true));
      break;
    case 'plane':
      html+=card('Plane',rowSlider('Offset',0,-100,100,' mm')+rowSlider('Angle',0,-90,90,'°')+rowSwitch('Flip normal',false));
      break;
    case 'axis':
      html+=card('Axis',rowVec3('Direction',['0.00','0.00','1.00'])+rowSwitch('Infinite',true));
      break;
    case 'origin':
      html+=card('Origin',rowVec3('Position',['0.00','0.00','0.00']));
      break;
    case 'curve':
      html+=card('Curve',rowText('Basis','Edge chain (4 edges)')+rowSlider('Smoothing',20,0,100,'%')+rowSwitch('Closed',false));
      break;
    case 'helix':
      html+=card('Helix',
        rowSlider('Turns',8,1,40,'')+rowSlider('Pitch',1.5,0.2,10,' mm')+
        rowSlider('Radius',6,1,60,' mm')+rowSeg('Handedness',['Right','Left'],'Right'));
      break;
    case 'spline':
      html+=card('Spline',rowText('Control points','7')+rowSlider('Degree',3,1,7,'')+rowSwitch('Periodic',false));
      break;
    case 'polygon':
      html+=card('Polygon',
        rowSlider('Sides',6,3,24,'')+rowSlider('Radius',12,1,100,' mm')+
        rowSeg('Fit',['Inscribed','Circumscribed'],'Inscribed')+rowSlider('Rotation',0,0,360,'°'));
      break;
    case 'extrude':
      html+=card('Extrude',
        rowText('Profile','Sketch_BasePlate')+
        rowSeg('Direction',['Normal','Reverse','Symmetric'],'Normal')+
        rowSlider('Distance',18,1,200,' mm')+rowSlider('Draft angle',0,-15,15,'°')+rowSwitch('Cap ends',true));
      break;
    case 'revolve':
      html+=card('Revolve',
        rowText('Profile','Sketch_BossProfile')+rowText('Axis','Axis_Z')+
        rowSlider('Angle',360,1,360,'°')+rowSwitch('Merge result',true));
      break;
    case 'sweep':
      html+=card('Sweep',
        rowText('Profile','Poly_HexBoss')+rowText('Path','Spline_Guide')+
        rowSlider('Twist',0,-360,360,'°')+rowSeg('Orientation',['Path','Fixed'],'Path'));
      break;
    case 'fillet':
      html+=card('Fillet',
        rowText('Edges','12 selected')+rowSlider('Radius',2.5,0.1,20,' mm')+
        rowSwitch('Tangent propagation',true)+rowSeg('Profile',['Circular','Conic'],'Circular'));
      break;
    case 'bool':
      html+=card('Boolean',
        rowSeg('Operation',['Union','Subtract','Intersect'],n.op||'Union')+
        rowSwitch('Keep tools',false)+rowSwitch('Merge coplanar faces',true));
      html+=card('Operands',
        n.kids.map(k=>`<div class="oprow">${IC.operand()}<span class="on">${k.name}</span><span class="ot">${k.tag}</span></div>`).join(''));
      break;
    case 'operand':
      html+=card('Operand',rowText('Feature',n.name)+rowText('Role',n.tag||'—')+rowText('Owner',n.parent?n.parent.name:'—'));
      break;
    case 'folder':
      html+=card('Folder',rowText('Children',String(n.kids.length))+rowSwitch('Suppress all',false));
      break;
  }
  if(['extrude','revolve','sweep','fillet','bool'].includes(n.type)){
    html+=card('Result',
      rowText('Faces','48')+rowText('Edges','112')+rowText('Rebuild time','3.2 ms'));
  }
  return html;
}

const propsEl=document.getElementById('props');
function renderProps(){
  const n=current();
  if(!n){ propsEl.innerHTML=`<div class="empty">${IC.part()}<span>Select a feature first</span></div>`; return; }
  propsEl.innerHTML=cardsFor(n);
  propsEl.querySelectorAll('.sld').forEach(s=>{
    const tr=s.querySelector('.track'), fill=s.querySelector('.fill'), knob=s.querySelector('.knob'), val=s.querySelector('.val');
    const min=+s.dataset.min, max=+s.dataset.max, unit=s.dataset.unit;
    const setFromX=x=>{
      const r=tr.getBoundingClientRect();
      const p=Math.max(0,Math.min(1,(x-r.left)/r.width));
      fill.style.width=(p*100)+'%'; knob.style.left=(p*100)+'%';
      const v=min+p*(max-min);
      val.textContent=(max-min>20?Math.round(v):v.toFixed(1))+unit;
    };
    tr.addEventListener('pointerdown',e=>{
      tr.setPointerCapture(e.pointerId); setFromX(e.clientX);
      const mv=ev=>setFromX(ev.clientX);
      tr.addEventListener('pointermove',mv);
      tr.addEventListener('pointerup',()=>tr.removeEventListener('pointermove',mv),{once:true});
    });
  });
  propsEl.querySelectorAll('.sw').forEach(sw=>sw.addEventListener('click',()=>sw.classList.toggle('on')));
  propsEl.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  })));
}

/* boot */
renderTree(); viewTo(0);
})();
</script>
