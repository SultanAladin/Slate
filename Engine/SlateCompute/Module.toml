# SlateCompute — device-side computation and the Shared/ parity gate.
# The first unit permitted to see both the device and the document.

[unit]
name    = "SlateCompute"
product = "StaticLibrary"
subject = [ "Compute" ]

# 📝 This is where the two peers meet. Every position crossing in is rebased in 64-bit before it narrows,
#    and every Shared/ entry point compiled here is registered with ParityRunner — `02` §8 and `00` §4.
[requires]
unit = [ "SlateMath", "SlateVulkan", "SlateDocument" ]

[external]
include = [ "$VULKAN_SDK/Include" ]
declare = []

[link]
library = []
