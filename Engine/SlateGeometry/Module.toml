# SlateGeometry — headless exact geometry kernel for CAD and surfacing authority.
#
# This unit owns exact geometric meaning, exact topology, modelling declarations, and
# exact-to-discrete seams. It deliberately does not own documents, imports, rendering,
# UI, GPU state, selection, or asset lifetime.

[unit]
name    = "SlateGeometry"
product = "StaticLibrary"
subject = [ "Geometry", "Topology", "Operation", "Discrete" ]

[requires]
# SlateMath supplies reusable numerical machinery; SlateGeometry supplies geometry authority.
unit = [ "SlateMath" ]

[external]
include = []
declare = []

[link]
unit    = [ "SlateMath" ]
library = []
