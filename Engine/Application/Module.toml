# Application — the host executables.
# ConsoleHost compiles with main() and runs headless.

[unit]
name    = "Application"
product = "Executable"
subject = [ "ConsoleHost", "PaintHost", "EditorHost", "InterfaceValidationHost" ]

# 📝 The host links every unit, so it is the one target where the whole DAG is realised at once. The link
#    order below is the reverse of the dependency order, which is what the linker resolves against.
[requires]
unit = [ "SlateScene", "SlateUI", "SlateCompute", "SlateVulkan", "SlateFeature", "SlateDocument", "SlateGeometry", "SlateMath" ]

[external]
include = [ "$VULKAN_SDK/Include", "ExternalPackages/glfw/include" ]
declare = []

# 📝 🔴 glfw3.dll is copied beside the executable rather than being found on PATH. glfw3dll.lib is an
#    import library; without the dynamic library beside the host, the process fails to start rather than
#    reporting anything a reader could act on.
# 📝 gdi32.lib carries the display-density read `04` §2 performs. It is the one platform import library
#    named here that the operating system does not supply by default.
[link]
# 🔴 `unit` here is the ARCHIVE order handed to the linker, most-dependent first, and it is a different
#    statement from `[requires].unit` above. That one says what this unit may **include**; this one says
#    what an executable must **link** so every reference resolves. They coincide for most units and part
#    for `SlateUI`, which links four archives and is permitted to include none of them — a static archive
#    only satisfies references the linker has already seen, so the order is load-bearing.
unit    = [ "SlateScene", "SlateUI", "SlateCompute", "SlateVulkan", "SlateFeature", "SlateDocument", "SlateGeometry", "SlateMath" ]
library = [ "$VULKAN_SDK/Lib/vulkan-1.lib", "ExternalPackages/glfw/lib-vc2022/glfw3dll.lib", "gdi32.lib" ]
# 📝 `carry` names files that must sit beside the executable for it to run. glfw3dll.lib above is an import
#    library, so the DLL itself is a run-time dependency the linker never copies; the appearance file is
#    read by every host at startup and written back when the artist changes a colour.
# 🔴 A carried file that is absent is reported and skipped, not fatal. glfw3.dll arrives with the vendored
#    package rather than the repository, so a checkout without it must still construct and link.
# 🔴 A carried entry that names a FOLDER is placed whole, leaf name preserved. EngineContent is named
#    that way — the shipped fonts, graphics and materials the content browser reads — because listing
#    its files one at a time here would make this manifest a second copy of the folder listing.
carry   = [ "ExternalPackages/glfw/lib-vc2022/glfw3.dll", "Configuration/SlateAppearance.toml", "EngineContent" ]
